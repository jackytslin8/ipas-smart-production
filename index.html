<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>一滴水・初級智慧生產工程師</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --soil:#bba88b; --speck:#a08d70; --speck2:#cbbb9f;
  --wet:#6f5a40;
  --panel:#e8ebe1; --ink:#27301f; --muted:#66705a; --line:#c9cfbd;
  --opt:#f4f6ef; --opt-hover:#fbfcf8;
  --water:#3b7ea8; --right:#4c7a33; --wrong:#a4513b; --star:#a8741a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
    --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
    --opt:#252b21; --opt-hover:#2d3428;
    --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f; --star:#e2b55a;
  }
}
:root[data-theme="dark"]{
  --soil:#5c4f3d; --speck:#4b4032; --speck2:#6a5c48; --wet:#2e251a;
  --panel:#1c2119; --ink:#e2e6d8; --muted:#9aa38c; --line:#343c2e;
  --opt:#252b21; --opt-hover:#2d3428;
  --water:#6fb1d8; --right:#8fbf6c; --wrong:#e0886f; --star:#e2b55a;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--panel); color:var(--ink);
  font-family:"LXGW WenKai TC","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  display:flex; overflow:hidden;
}
button{font:inherit}
.land{position:relative;flex:1;min-width:0;min-height:0;background:var(--soil);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;cursor:default}
.land.has-water canvas{cursor:pointer}
.hint{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-size:1.35rem;color:var(--ink);opacity:.55;pointer-events:none;
  text-align:center;line-height:1.6;transition:opacity .6s;white-space:nowrap;
}
.hint.gone{opacity:0}
.toast{
  position:absolute;left:50%;bottom:1.25rem;transform:translateX(-50%);
  background:var(--panel);color:var(--ink);padding:.5rem 1rem;border-radius:999px;
  font-size:1rem;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:.95}
.snap{
  position:absolute;right:.75rem;top:.75rem;font-size:.9rem;
  color:var(--ink);background:var(--panel);border:0;border-radius:999px;
  padding:.35rem .9rem;cursor:pointer;opacity:.85;
}
.snap:hover{opacity:1}
.snap[hidden]{display:none}

.panel{
  width:min(540px,48vw);display:flex;flex-direction:column;
  border-left:1px solid var(--line);min-height:0;
}
.water{
  display:flex;align-items:center;gap:.6rem;padding:.9rem 1.25rem;
  border-bottom:1px solid var(--line);min-height:3.75rem;
}
.water-label{font-size:1rem;color:var(--muted);white-space:nowrap}
.drops{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;flex:1;min-width:0}
.drops svg{width:18px;height:24px;display:block}
.drops .more{font-size:1rem;color:var(--water);margin-left:.25rem}
.drops .none{color:var(--muted);font-size:.95rem}
.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(0) translateY(-8px)}100%{transform:scale(1)}}
.bar-btn{
  flex:none;font-size:.9rem;color:var(--muted);background:none;
  border:1px solid transparent;border-radius:999px;padding:.3rem .75rem;cursor:pointer;white-space:nowrap;
}
.bar-btn:hover{border-color:var(--line);color:var(--ink)}
.bar-btn.armed{color:var(--wrong);border-color:var(--wrong)}
#range{color:var(--ink);border-color:var(--line)}

.view{flex:1;overflow-y:auto;padding:1.1rem 1.5rem 1.5rem;min-height:0}
.view[hidden]{display:none}
.where{display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:center;font-size:.85rem;color:var(--muted);margin:0 0 .9rem}
.kind{color:var(--ink);background:var(--opt);border:1px solid var(--line);border-radius:999px;padding:.05rem .6rem}
.again{color:var(--wrong)}
.again[hidden]{display:none}
.star{margin-left:auto;font-size:.85rem;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:.1rem .7rem;cursor:pointer;white-space:nowrap}
.star:hover{color:var(--ink);border-color:var(--muted)}
.star[aria-pressed="true"]{color:var(--star);border-color:var(--star)}

.stem{margin:0 0 1rem;font-size:1.08rem;line-height:1.8;white-space:pre-line}

.opts{display:flex;flex-direction:column;gap:.5rem;margin:0;padding:0;list-style:none}
.opt{
  display:flex;gap:.6rem;width:100%;text-align:left;font-size:1rem;line-height:1.6;
  color:var(--ink);background:var(--opt);border:1.5px solid var(--line);border-radius:10px;
  padding:.6rem .8rem;cursor:pointer;
}
.opt:hover:not(:disabled){background:var(--opt-hover);border-color:var(--muted)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--right);background:color-mix(in srgb,var(--right) 14%,var(--opt))}
.opt.right .k{color:var(--right)}
.opt.wrong{border-color:var(--wrong);opacity:.8}
.opt.wrong .k{color:var(--wrong)}
.opt.dim{opacity:.5}

.after{margin-top:1rem;display:none;flex-direction:column;gap:.75rem}
.after.on{display:flex}
.msg{font-size:1rem;line-height:1.6;margin:0}
.msg.good{color:var(--right)}
.msg.bad{color:var(--wrong)}
.card{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.6rem .8rem;border-radius:10px;background:var(--opt);border:1px solid var(--line)}
.card b{font-size:1.05rem;color:var(--right);flex:none}
.card span{line-height:1.6}
.card .ex{flex-basis:100%;color:var(--ink);font-size:.95rem;line-height:1.75}
.card .ex.none{color:var(--muted);font-size:.85rem}
.next{
  align-self:flex-start;font-size:1rem;padding:.55rem 1.2rem;border-radius:999px;cursor:pointer;
  background:var(--ink);color:var(--panel);border:0;
}
.next:disabled{opacity:.4;cursor:default}
.ghost{
  font-size:1rem;padding:.55rem 1.1rem;border-radius:999px;cursor:pointer;
  background:none;color:var(--muted);border:1px solid var(--line);
}
.ghost:hover{color:var(--ink)}

/* range picker */
.pick h2{font-size:1.25rem;margin:0 0 .25rem}
.pick h3{font-size:1rem;margin:1.1rem 0 .5rem;color:var(--muted);font-weight:400}
.pick .sub{margin:0 0 .75rem;color:var(--muted);font-size:.9rem}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.8rem,1fr));gap:.5rem}
.unit,.chip{
  text-align:left;color:var(--ink);background:var(--opt);border:1.5px solid var(--line);
  border-radius:10px;padding:.55rem .7rem;cursor:pointer;
}
.unit{display:flex;flex-direction:column;gap:.25rem}
.unit[aria-pressed="true"],.chip[aria-pressed="true"]{border-color:var(--water);background:color-mix(in srgb,var(--water) 13%,var(--opt))}
.unit .pg{font-weight:700;font-size:1.05rem}
.unit .meta{font-size:.8rem;color:var(--muted)}
.unit .bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--right)}
.quick{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0 0}
.quick button{font-size:.85rem;padding:.25rem .8rem;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:.5rem}
.chip{border-radius:999px;padding:.4rem .9rem}
.chip small{color:var(--muted);margin-left:.3rem}
.unit .desc{font-size:.8rem;color:var(--muted)}
.unit:disabled{opacity:.45;cursor:default}
.quick button:disabled{opacity:.45;cursor:default}
.wrongbook{margin-top:.75rem;border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;background:var(--opt)}
.wrongbook[hidden]{display:none}
.book-head{display:flex;align-items:center;justify-content:space-between;gap:.5rem;flex-wrap:wrap}
.book-head .sub{margin:0}
.book-head .ghost{padding:.3rem .9rem;font-size:.9rem}
.book{list-style:none;margin:.5rem 0 0;padding:0;max-height:16rem;overflow-y:auto}
.book{max-height:24rem}
.book li{border-top:1px solid var(--line)}
.bq{display:flex;flex-wrap:wrap;gap:.15rem .6rem;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:.5rem 0;cursor:pointer;font-size:.95rem;line-height:1.6}
.bq .src{color:var(--muted);font-size:.8rem}
.bq .bstem{flex-basis:100%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.bq .bans{flex-basis:100%;color:var(--right);font-size:.9rem;display:none}
.book li.open .bstem{display:block;-webkit-line-clamp:unset}
.book li.open .bans{display:block}
.book .tag{color:var(--wrong);font-size:.8rem}
.book .tag.ok{color:var(--right)}
.book .tag.plain{color:var(--muted)}
.book li{display:flex;align-items:flex-start;gap:.4rem}
.book .bq{flex:1;min-width:0}
.bstar{flex:none;background:none;border:0;color:var(--muted);font-size:1.1rem;line-height:1;padding:.55rem .2rem;cursor:pointer}
.bstar[aria-pressed="true"]{color:var(--star)}
.book-btns{display:flex;gap:.4rem;flex-wrap:wrap}
.stale{
  position:absolute;left:50%;top:.75rem;transform:translateX(-50%);width:max-content;max-width:calc(100% - 2rem);
  background:var(--panel);color:var(--ink);border:1.5px solid var(--wrong);border-radius:12px;
  padding:.6rem .9rem;font-size:.95rem;line-height:1.5;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;
}
.stale[hidden]{display:none}
.stale button{font-size:.9rem;padding:.3rem .9rem;border-radius:999px;border:0;background:var(--ink);color:var(--panel);cursor:pointer}
/* 存檔失敗警告會一直掛著：靠左放，讓出右上角的「存成圖片」 */
#savewarn{left:.75rem;transform:none;max-width:calc(100% - 8.5rem)}
.go{margin-top:1.25rem}
.credit{margin:.9rem 0 0;font-size:.75rem;line-height:1.6;color:var(--muted)}
.credit .ver{margin-left:.5rem;white-space:nowrap}
.fine{margin-top:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

button:focus-visible,.unit:focus-visible,.chip:focus-visible{outline:3px solid var(--water);outline-offset:2px}
/* 鍵盤移動選項：低調的焦點（只在鍵盤操作時出現，滑鼠點擊不會） */
.opt:focus-visible{outline:none;border-color:var(--water);background:var(--opt-hover);box-shadow:0 0 0 3px color-mix(in srgb,var(--water) 16%,transparent)}

@media (max-width:760px){
  body{flex-direction:column}
  .land{flex:1 1 40%}
  .panel{width:100%;flex:1 1 60%;border-left:0;border-top:1px solid var(--line)}
  .water{padding:.5rem 1rem;min-height:3rem;gap:.4rem}
  .view{padding:.9rem 1rem 1.2rem}
  .stem{font-size:1.02rem}
  .opt{font-size:.97rem}
}
@media (max-width:480px){ .water-label{display:none} }
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<main class="land" id="land">
  <canvas id="cv" aria-label="你的土地。手上有水時，點一下土地把水滴下去。"></canvas>
  <div class="hint" id="hint">一片安靜的空地</div>
  <div class="toast" id="toast" role="status"></div>
  <button class="snap" id="snap" hidden>存成圖片</button>
  <div class="stale" id="stale" role="alert" hidden>另一個分頁更新了紀錄，這個分頁先暫停存檔。<button type="button" onclick="location.reload()">重新載入</button></div>
  <div class="stale" id="savewarn" role="alert" hidden>存檔失敗（可能是瀏覽器空間不足），最近的進度還沒存到。</div>
</main>
<aside class="panel">
  <div class="water">
    <span class="water-label">手上的水</span>
    <div class="drops" id="drops" aria-live="polite"></div>
    <button class="bar-btn" id="range">範圍</button>
    <button class="bar-btn" id="reset">清空土地</button>
  </div>

  <section class="view" id="quiz" hidden>
    <p class="where"><span class="kind" id="kind"></span><span id="scope"></span><span class="again" id="again" hidden>上次答錯的題</span><button class="star" id="star" type="button" aria-pressed="false" title="標成不確定（鍵盤 S）">☆ 不確定</button></p>
    <p class="stem" id="stem"></p>
    <ul class="opts" id="opts"></ul>
    <div class="after" id="after">
      <p class="msg" id="msg"></p>
      <div class="card" id="card"></div>
      <button class="next" id="next">下一題</button>
    </div>
  </section>

  <section class="view pick" id="pick" hidden>
    <h2>要練哪些題？</h2>
    <p class="sub">初級智慧生產工程師能力鑑定。可以選一份，也可以多選一起考。</p>
    <div class="units" id="units"></div>
    <div class="quick">
      <button type="button" data-q="1">全選科目一</button>
      <button type="button" data-q="2">全選科目二</button>
      <button type="button" data-q="all">全選</button>
      <button id="book" type="button">看錯題本</button>
      <button id="starbook" type="button">看星號題</button>
      <button id="allbook" type="button">錯題＋星號一起看</button>
    </div>
    <div class="wrongbook" id="wrongbook" hidden></div>
    <h3>出題方式</h3>
    <div class="chips">
      <button class="chip" id="weak">只出還不熟的題</button>
      <button class="chip" id="mix">打亂選項順序</button>
    </div>
    <button class="next go" id="go">開始</button>
    <div class="fine">
      <span>連續答對兩次，就算這題「熟了」。紀錄存在這台裝置上。</span>
      <button class="bar-btn" id="wipe">清除作答紀錄</button>
    </div>
    <p class="credit">題目：114-2 初級智慧生產工程師能力鑑定試題：智慧製造生產線管理基礎（阿摩線上測驗 #133489）。<span class="ver" id="ver"></span></p>
  </section>
</aside>

<script type="application/json" id="bank">[{"id":"115-2-1-1","src":"115-2","subj":1,"n":1,"q":"1. 下列何者不是 ERP 系統的一般主要功能？","o":["生產計畫與排程","存貨管理","生產成本控制","工作站管理"],"a":3,"ex":"1. 題目解析\n本題是針對企業資源規劃（ERP）系統的主要功能進行考查，要求選出一項不是ERP系統的一般主要功能。選項中提供了四個不同的功能，正確答案為(D)工作站管理。\n2. 解題步驟\n- 第一步：理解ERP系統的定義與功能  \n  ERP系統是一種集成的管理系統，旨在通過整合企業內部各個部門的資訊流、物流和資金流，以提高企業的運營效率和決策能力。\n\n- 第二步：分析各選項  \n  - (A) 生產計畫與排程：這是ERP系統的核心功能之一，用於計劃和安排生產流程，確保資源的有效利用。\n  - (B) 存貨管理：這也是ERP系統的一個重要功能，幫助企業管理原材料和成品的庫存，實現成本控制和需求預測。\n  - (C) 生產成本控制：這項功能涉及到追踪和管理生產過程中的各項成本，是ERP系統的一個重要面向。\n  - (D) 工作站管理：雖然這可能在某些情況下與生產有關，但它通常不被認為是ERP系統的核心功能。工作站管理通常涉及具體的工作區域和設備管理，而不是整體的資源規劃。\n\n- 第三步：確定正確答案  \n  比較各選項後，發現(D)工作站管理並不是ERP系統的一般主要功能，因此選擇(D)作為正確答案。\n3. 相關概念說明\n- ERP系統的功能：\n  - 生產計畫與排程：協助企業根據市場需求、資源可用性等因素進行有效的生產安排。\n  - 存貨管理：確保企業擁有足夠的原料和產品以滿足需求，避免過多的庫存積壓。\n  - 生產成本控制：分析和管理生產過程中的各項開支，以提高效率和降低成本。\n  \n- 工作站管理：通常涉及到特定的工作場所或機器的管理，著重於現場操作，而不是整體資源配置。\n4. 注意事項\n- 在回答此類問題時，需明確理解每個選項所代表的功能及其在ERP系統中的位置。\n- 特別注意專業術語的使用，因為不同領域對某些詞彙的定義可能會有所不同。\n- 如果不確定某個選項是否屬於ERP系統的功能，可以回顧相關課程資料或文獻，以確認其正確性。","t":""},{"id":"115-2-1-2","src":"115-2","subj":1,"n":2,"q":"2. E 化製造系統中，製造現場機台設備故障時，對於物料流及產量等的衝擊可即時被估計出，並經由 MES、ERP 及 CRM 的合作機制即時更新所衍生的庫存需求異動和物料運送資訊，即時讓客服人員得知作應變處理。此為 E 化製造系統四大功能中的何種功能？","o":["資料收集及轉換","預測","同步化","最佳化"],"a":2,"ex":"1. 題目解析\n\n題目中提到的情境是當製造現場的機台設備發生故障時，系統能夠即時評估對物料流和產量的影響，並透過 MES（製造執行系統）、ERP（企業資源規劃）和 CRM（客戶關係管理）等系統的合作機制，迅速更新庫存需求和物料運送資訊，以便客服人員能夠進行應變處理。這一系列動作強調了系統間的協作和即時更新能力，最終目標是使生產過程可以更為流暢和高效。\n2. 解題步驟\n\n- 理解問題背景：仔細閱讀題目，了解 E 化製造系統的運作流程和主要功能。\n- 分析選項：\n  - (A) 資料收集及轉換：指的是將收集到的數據進行整理和轉化，這個過程主要是數據的初步處理。\n  - (B) 預測：通常涉及到對未來情況的預測，例如需求預測或產量預測，但題目所述的是即時反應。\n  - (C) 同步化：強調系統間的協調和即時更新，正符合題目中提到的即時反應和資料更新。\n  - (D) 最佳化：指的是在給定的條件下，尋找最佳的解決方案，這與即時反應的概念不太相符。\n- 選擇正確答案：根據以上分析，選擇 (C) 同步化為正確答案，因為題目重點在於系統間的協調和即時處理能力。\n3. 相關概念說明\n\n- E 化製造系統：是指利用電子技術和信息技術來提升製造過程的效率和靈活性。它整合了多種系統（如 MES、ERP 和 CRM），以提高整體生產流程的協調性。\n  \n- MES（製造執行系統）：專注於工廠內部的生產流程管理，能實時監控生產狀態，並提供生產數據。\n\n- ERP（企業資源規劃）：整合企業內部的各種資源與流程，進行全面的資源管理，包括財務、供應鏈、庫存等。\n\n- CRM（客戶關係管理）：用於管理企業與客戶之間的關係，並提升客戶滿意度和忠誠度。\n\n- 同步化：在製造系統中，指的是在生產過程中各系統之間的信息能夠及時交換和更新，以實現更高的反應速度和靈活性。\n4. 注意事項\n\n- 在解答此類題目時，要特別注意題目中的關鍵詞，如「即時」、「協作機制」等，這些詞語能幫助你理解問題的重點。\n- 理解每個選項的具體意義，並在選擇時考慮其與題目內容的相關性。\n- 在學習相關概念時，可以參考實際的 E 化製造案例，以便更好地理解其運作方式和功能。","t":""},{"id":"115-2-1-3","src":"115-2","subj":1,"n":3,"q":"3. 下列關於 ESP32 的敘述何者正確？","o":["ESP32 的開發板最大優勢為自帶 Wi-Fi 模塊，方便連接網路，應用場景包含「家電監控」、「遠端遙控」、「點對點溝通」及「雲端資料庫」等","ESP32 由於具有作業系統，可以設計出功能更豐富的軟體","ESP32 幾乎可看作一台個人電腦，又有低功耗的優勢，常用來作為網路伺服器","ESP32 是一款超小體積的計算機，它需要利用 TF 卡裝載作業系統 才能夠運行"],"a":0,"ex":"1. 題目解析\n這道題目考查的是 ESP32 的特性及其應用。題目提供了四個選項，讓我們判斷哪一項敘述正確。ESP32 是一個功能強大的微控制器，廣泛應用於物聯網（IoT）領域，因此正確的描述會針對其功能、應用場景及技術特點進行說明。\n2. 解題步驟\n- 逐一檢視選項的內容：我們需要對每一個選項進行仔細分析，並根據 ESP32 的實際特性來判斷正確性。\n  \n  (A) 提到 ESP32 的 Wi-Fi 功能及其多樣的應用場景。  \n  (B) 認為 ESP32 由於作業系統的存在，能夠設計出更豐富的軟體。  \n  (C) 認為 ESP32 類似於個人電腦並且可以作為網路伺服器。  \n  (D) 認為 ESP32 是超小體積的計算機，並需要 TF 卡來運行作業系統。  \n\n- 檢查每個選項的真實性：根據 ESP32 的技術規格和功能，逐一核實各選項的正確性。\n\n- 選擇正確答案：根據上述分析，選擇最符合 ESP32 特性的選項。\n3. 相關概念說明\n- ESP32：由 Espressif Systems 開發的微控制器，內建 Wi-Fi 和藍牙功能，非常適合用於物聯網應用。其高效能和低功耗使其成為各類無線應用的理想選擇。\n\n- 作業系統：ESP32 通常使用 FreeRTOS 作為其操作系統，這使得開發者可以設計多任務的應用。但這並不意味著 ESP32 本身是一台完整的個人電腦。\n\n- 應用場景：ESP32 被廣泛應用於智能家居、遠端控制、數據收集等領域，其無線連接功能使得設備之間的通訊變得簡單。\n\n- TF 卡：ESP32 本身不需要 TF 卡來運行，雖然可以使用 TF 卡進行資料儲存，但這不是其運行的必要條件。\n4. 注意事項\n- 選項 A 的正確性：選項 A 正確地描述了 ESP32 的優勢和應用場景，這是其主要特點之一。\n\n- 選項 B 的誤解：雖然 ESP32 可以運行具有複雜功能的軟體，但並不是因為有作業系統就能設計出更豐富的軟體，這仍然依賴於開發者的設計能力。\n\n- 選項 C 的誤導：ESP32 確實可以作為網路伺服器，但它的功能和性能仍然不能與完整的個人電腦相提並論。\n\n- 選項 D 的不實：ESP32 不需要 TF 卡即可運行，這是其一大優勢，能夠在很多場景下以更小的體積和更低的成本運行。\n\n經過以上分析，選擇 A 作為正確答案。","t":""},{"id":"115-2-1-4","src":"115-2","subj":1,"n":4,"q":"4. 下列關於 Arduino 與樹莓派的敘述何者有誤？","o":["Arduino 無法運行作業系統，這就意味著許多基於作業系統實現的功能無法利用 Arduino 獲得","Arduino 沒有音視頻輸出接口，也沒有網絡接口和能與外圍設備連接的 USB 接口，開發板上沒有多餘的板載存儲器","樹莓派幾乎可看作一台個人電腦，又有低功耗的優勢，常用來作為網路伺服器","樹莓派的性能偏弱，無法處理圖像、複雜運算等對處理器性能要求比較高的場景，但它適合控制感測器輸入輸出、驅動電子元器件這類場合"],"a":3,"ex":"題目解析\n\n本題旨在考察考生對於 Arduino 和樹莓派的理解，特別是它們的功能、性能以及適用場景。選擇正確的選項以找出哪一項敘述是錯誤的。\n解題步驟\n\n1. 逐一分析選項：\n   - 選項 A：Arduino 無法運行作業系統，這意味著它無法利用許多基於作業系統的功能。\n   - 選項 B：Arduino 沒有音視頻輸出接口，沒有網絡接口，也沒有 USB 接口，且開發板上沒有多餘的板載存儲器。\n   - 選項 C：樹莓派幾乎可以看作是一台個人電腦，並且具有低功耗的優勢，常用作網路伺服器。\n   - 選項 D：樹莓派的性能偏弱，無法處理圖像和複雜運算，但適合控制感測器和驅動電子元器件。\n\n2. 判斷正確性：\n   - 選項 A：正確，因為 Arduino 確實無法運行完整的作業系統，主要是基於微控制器的架構。\n   - 選項 B：正確，Arduino 通常不具備這些功能，主要用於簡單的控制任務。\n   - 選項 C：正確，樹莓派的確可以作為一台小型個人電腦，並且因為其架構的設計，能夠用於網路伺服器。\n   - 選項 D：錯誤，樹莓派的性能雖然不如高端電腦，但仍然能處理一定的圖像處理和複雜運算，適合用於許多計算密集型的應用。\n\n3. 選擇錯誤的選項 D。\n相關概念說明\n\n- Arduino：一種開源電子原型平台，基於易於使用的硬體和軟體，主要用於控制類型的應用，通常不具備處理高負載的能力。它的設計目的是簡化電子工程的學習和實作。\n\n- 樹莓派：一款小型的個人電腦，具備完整的作業系統（如 Linux），能夠進行多樣的計算任務，並且可以接入外部設備進行擴展。樹莓派可以用於編程學習、網路伺服器、媒體中心等多種用途，性能也相對較強。\n注意事項\n\n1. 理解硬體架構：在考慮選項時，要明白 Arduino 和樹莓派的設計目的和功能定位，這有助於正確理解它們的優缺點。\n\n2. 性能評估：對於性能的評估，應考慮到實際的應用場景，有些場合即使是較低性能的硬體仍然能夠有效運行。\n\n3. 隨著技術的發展：硬體技術持續進步，對於產品的功能和性能的理解也需跟隨最新的技術進展。","t":""},{"id":"115-2-1-5","src":"115-2","subj":1,"n":5,"q":"5. 下列何者並非為設備保養的目的？","o":["故障停工時間減少","備用機器增加","資產壽命減少","加班費用減少"],"a":1,"ex":"題目解析\n\n本題的目的是要讓考生了解設備保養的主要目的及其影響。設備保養通常是為了確保機器的正常運行，減少故障率，延長使用壽命，並提高生產效率。題目中給出的選項中，只有「備用機器增加」並不是設備保養的直接目的，因此選擇這個選項作為正確答案。\n解題步驟\n\n1. 了解設備保養的目的：首先，要清楚設備保養的主要目的，這包括減少故障、延長設備壽命、提高生產效率等。\n  \n2. 分析各選項：\n   - (A) 故障停工時間減少：這是設備保養的目標之一，因為定期保養能預防故障，從而減少不必要的停工時間。\n   - (B) 備用機器增加：這並不是保養的目的，備用機器的增加通常是因為需求或產量增加，而非保養措施的直接結果。\n   - (C) 資產壽命減少：保養的目的是延長資產的壽命，因此這個選項是與設備保養的目的相反的。\n   - (D) 加班費用減少：有效的設備保養可以減少故障，使得生產更加順暢，從而減少因為設備問題而導致的加班。\n\n3. 選擇正確答案：根據以上分析，選項 (B) 是正確答案，因為它並未符合設備保養的目的。\n相關概念說明\n\n1. 設備保養的目的：\n   - 故障預防：定期的保養可檢查並提前發現潛在問題，減少意外故障的機會。\n   - 延長設備壽命：良好的保養能延長設備的使用壽命，降低更新換代的頻率及成本。\n   - 提高工作效率：設備運行穩定，能提高生產效率，減少浪費。\n   - 減少運營成本：透過減少故障和停工，降低因維修或加班產生的額外成本。\n\n2. 備用機器的概念：備用機器是企業為了應對突發情況或需求增加而準備的備用設備，這與設備保養的直接目的無關。\n注意事項\n\n- 在考試中，細心閱讀每個選項，理解其意義，特別是要注意選項之間的關聯性。\n- 保養的目的不僅是延長設備壽命，還包括提高生產效率、降低運行成本等，這些都是考生需要掌握的知識。\n- 面對類似的題型，考生可以運用排除法，逐一分析選項，找到最不符合題意的選項。","t":""},{"id":"115-2-1-6","src":"115-2","subj":1,"n":6,"q":"6. 下列敘述何者並非是需要首件檢驗的情況？","o":["中午休息的時候","一般產品開始投產時","設備重新調整或工藝有重大變化時","操作工人變化時"],"a":0,"ex":"1. 題目解析\n本題旨在考察首件檢驗（First Piece Inspection）的必要性。在生產過程中，為了確保產品的品質，某些特定情況下需要進行首件檢驗。選項中給出了四種情況，通常在這些情況下需要進行首件檢驗，以確保生產的產品符合規範和標準。\n2. 解題步驟\n- 步驟一：理解首件檢驗的定義。首件檢驗是指在生產過程開始時，對第一件產品進行檢查，以確認其符合設計規範和品質標準。\n- 步驟二：逐一分析選項：\n  - (A) 中午休息的時候：這是一個時間點，並不涉及產品生產的條件或環境變化，因此不需要進行首件檢驗。\n  - (B) 一般產品開始投產時：這是典型的首件檢驗情況，因為產品剛開始生產，需要確認品質。\n  - (C) 設備重新調整或工藝有重大變化時：這也是需要進行首件檢驗的情況，因為設備或工藝的變更可能會影響產品的品質。\n  - (D) 操作工人變化時：當操作工人變化時，也應進行首件檢驗，以確保新工人能夠正確操作設備，生產出符合品質要求的產品。\n- 步驟三：根據分析，選擇不需要首件檢驗的選項，即(A)。\n3. 相關概念說明\n- 首件檢驗（First Piece Inspection）：在生產過程中，針對第一件產品進行檢查的程序，目的是驗證產品是否符合設計和品質標準。這有助於及時發現問題，並在生產過程中進行調整。\n- 首件檢驗的必要性：在以下情況中通常需要進行首件檢驗：\n  1. 新產品的投產。\n  2. 設備或生產工藝的變更。\n  3. 操作工人變更，以確保生產過程的連續性和穩定性。\n4. 注意事項\n- 在生產過程中，首件檢驗不僅是為了確保產品的品質，還可以幫助企業避免浪費和減少不良品的產生。\n- 雖然選擇(A)是正確答案，但實際情況中，即使在中午休息期間，若生產線重新啟動，也應考慮進行首件檢驗，以確保生產的連貫性。\n- 在進行首件檢驗時，應有明確的檢查標準和流程，以提高檢驗的效率和準確性。","t":""},{"id":"115-2-1-7","src":"115-2","subj":1,"n":7,"q":"7. 製造執行系統(MES)核心功能不包含以下何者？","o":["存貨追蹤與管理","規劃系統介面","例外管理","以上皆是"],"a":3,"ex":"1. 題目解析\n這道題目詢問的是製造執行系統（Manufacturing Execution System, MES）的核心功能有哪些，並要求選擇不包含的項目。選項提供了四個功能，其中選項 D 表示以上皆是，即所有選項均不屬於 MES 的核心功能。\n2. 解題步驟\n- 首先，我們需要了解 MES 的定義及其核心功能。\n- 接下來，逐一分析每個選項的功能，確認它們是否為 MES 的核心功能。\n- 最後，根據分析結果選擇正確答案。\n3. 相關概念說明\n製造執行系統（MES）是一種在製造過程中用來監控、控制和管理生產的系統。其主要功能包括：\n\n- 存貨追蹤與管理 (A)：這是 MES 的一個重要功能，能夠追蹤原材料、半成品和成品的庫存狀態，確保生產過程中物料的可用性。\n\n- 規劃系統介面 (B)：雖然 MES 需要與規劃系統（如 ERP 系統）進行接口，但規劃本身並不是 MES 的核心功能。MES 主要側重於生產現場的實時數據管理和控制。\n\n- 例外管理 (C)：這是 MES 的一項核心功能，目的是對生產過程中的異常情況進行即時處理和管理，以確保生產過程的順暢。\n\n根據上述分析：\n\n- 選項 A 和 C 為 MES 的核心功能。\n- 選項 B 雖然與 MES 相關，但不屬於其核心功能。\n4. 注意事項\n- 在考試中，對於每個選項的理解至關重要，特別是當某些功能似乎與系統相關但並不是核心時。\n- 需仔細閱讀題目的措辭，了解「不包含」的意思，以免混淆。\n- 了解 MES 的功能範疇及其與其他系統（如 ERP 系統）的關係，能夠幫助更好地理解考題的內容。\n\n因此，正確答案是 D，因為選項 B（規劃系統介面）不是 MES 的核心功能。","t":""},{"id":"115-2-1-8","src":"115-2","subj":1,"n":8,"q":"8. 企業資訊規劃(ERP)往企業內部管理的工作包含以下何者？","o":["營運","品質","距離","以上皆非"],"a":0,"ex":"1. 題目解析\n\n本題旨在考察對於企業資訊規劃（ERP）系統在企業內部管理中所涵蓋內容的理解。ERP系統的主要功能是整合企業內部的各項資源，提升營運效率，並促進資訊的流通與共享。選項中提到的「營運」和「品質」是企業管理中的重要方面，而「距離」則與企業內部管理的關聯性較低。\n2. 解題步驟\n\n1. 理解ERP系統的定義與功能：ERP系統是一種集成的管理系統，旨在整合企業的各個部門和功能，包括財務、供應鏈、人力資源、製造等。\n  \n2. 分析選項內容：\n   - (A) 營運：指企業的日常運作和管理，通常是ERP系統的核心功能之一。\n   - (B) 品質：雖然品質管理也是企業管理的重要部分，但它通常不是ERP系統的直接功能，而是透過其他系統或模組來實現的。\n   - (C) 距離：與內部管理無直接關聯，通常涉及物流或地理分布等外部因素。\n   - (D) 以上皆非：不符合題意，因為(A)選項是正確的。\n\n3. 選擇正確答案：根據對選項的分析，選擇(A)營運作為正確答案。\n3. 相關概念說明\n\n- 企業資源規劃（ERP）：是一種企業管理軟體，它集成了企業的各種業務流程，幫助企業在資源運用上達到最優化。ERP系統的主要功能包括：\n  - 數據整合：將各部門的數據整合到一個平台上，便於管理與分析。\n  - 流程自動化：自動化各種業務流程，減少人為錯誤，提高效率。\n  - 即時資訊：提供即時的業務報告和數據分析，幫助管理層做出快速決策。\n\n- 營運管理：涉及到產品的生產、服務的提供和資源的配置等各個方面，是企業的核心業務活動。良好的營運管理可以提高生產效率、降低成本，從而提升企業的競爭力。\n4. 注意事項\n\n- 在回答此類考題時，應該仔細分析每個選項的意義，並思考它們與題目主題（即ERP系統）之間的關聯。\n- 注意一些選項可能具有誤導性，特別是與企業內部管理無關的選項，需特別留意。\n- 對於企業管理的相關概念，最好具備一定的基礎知識，這樣能在考試中更快做出正確判斷。\n\n透過以上的解析與說明，希望可以幫助你更深入了解企業資訊規劃（ERP）以及其在企業內部管理中的角色。","t":""},{"id":"115-2-1-9","src":"115-2","subj":1,"n":9,"q":"9. 下列何者非預防性保養的好處？","o":["避免服務中斷並提高生產力","延長資產壽命、推遲重新購買","減少機台設備維修保養花費的時間成本","降低維修的成本和複雜性"],"a":2,"ex":"題目解析\n\n題目要求找出「非預防性保養的好處」，因此我們需要針對選項進行分析，看看哪個選項並不是預防性保養所帶來的好處。預防性保養旨在通過定期檢查和維護，防止故障的發生，進而延長設備的使用壽命，降低未來的維修成本和服務中斷的機會。\n解題步驟\n\n1. 理解預防性保養的定義：預防性保養是透過定期的檢查和維護來避免設備故障，與反應性保養相對，後者是在故障發生後才進行維修。\n\n2. 分析每一個選項：\n   - (A) 避免服務中斷並提高生產力：這是預防性保養的一個好處，因為透過定期維護，可以減少意外故障，提高生產的穩定性。\n   - (B) 延長資產壽命、推遲重新購買：預防性保養有助於保持設備在最佳狀態，從而延長其使用壽命，這也是其主要目的之一。\n   - (C) 減少機台設備維修保養花費的時間成本：這個選項的措辭可能會引起混淆。預防性保養的目的是預防故障，因此所需的維修時間成本通常是減少的，而不是事前的保養所耗費的時間成本。在這裡，C選項強調的是「維修保養花費的時間成本」，這是反應性保養的特點，因為在故障後，維修所需的時間會增加。\n   - (D) 降低維修的成本和複雜性：預防性保養確實能夠降低未來的維修成本，因為維護得當可以減少大修的機會。\n\n3. 選擇正確答案：根據以上分析，選項C最不符合預防性保養的好處，因為它強調的是維修的時間成本，而非保養本身的效益。\n相關概念說明\n\n- 預防性保養：這是一種計劃性維護策略，通過定期檢查和維護來降低設備故障風險，通常在設備使用壽命內進行，目的是保持設備的最佳運行狀態。\n- 反應性保養：這是當設備出現故障時才進行的維修，通常會導致更高的維修成本和服務中斷。\n- 設備壽命和成本效益：有效的預防性保養可以延長設備的壽命，減少整體的運行成本，並提高生產效率。\n注意事項\n\n- 在考試時，仔細閱讀每一個選項的措辭，特別是關鍵詞，如「時間成本」、「降低」、「避免」等，這可以幫助你更精確地理解每一個選項的意義。\n- 理解不同維護策略的優缺點，有助於在未來的實務中選擇合適的保養方案，提高設備管理的效率。","t":""},{"id":"115-2-1-10","src":"115-2","subj":1,"n":10,"q":"10. 下列何者不屬於智慧化現場管理概念？","o":["建構可視化戰情看板掌握產品帳料資訊","利用機器學習技術分析產品品質數據預防問題再發","推動創新改善並將流程建立標準化操作系統","運用 RFID 和感測元件在生產現場收集並呈現予管理、作業人員特定資訊"],"a":1,"ex":"1. 題目解析\n\n本題的目的是考察考生對於智慧化現場管理概念的理解。智慧化管理通常涉及使用各種技術和工具來提升管理效率、改善生產流程以及增強決策能力。在四個選項中，我們需要找出一個不屬於智慧化現場管理概念的選項。\n2. 解題步驟\n\n1. 逐一分析選項：\n   - (A) 建構可視化戰情看板掌握產品帳料資訊： 這是智慧化管理的一部分，因為可視化工具讓管理者快速了解生產狀況和資源使用情況。\n   - (B) 利用機器學習技術分析產品品質數據預防問題再發： 雖然這聽起來高科技，但它的焦點在於「預防問題再發」，並不是直接改善現場管理的概念。\n   - (C) 推動創新改善並將流程建立標準化操作系統： 這是智慧化管理的核心，因為標準化和創新都是提升效率的重要方法。\n   - (D) 運用 RFID 和感測元件在生產現場收集並呈現予管理、作業人員特定資訊： 這也是智慧化管理的重要技術，因為它涉及到數據的即時收集與分析。\n\n2. 選擇不屬於智慧化現場管理的選項：\n   - 根據上述分析，選項B雖然涉及數據分析，但其重點在於「預防問題再發」，不直接改善現場管理的流程，因此選擇B作為正確答案。\n3. 相關概念說明\n\n- 智慧化現場管理： 指的是利用信息技術、數據分析、物聯網（IoT）等技術來提升生產效率、增強透明度、及時反應市場需求等。這通常包括可視化工具、實時數據收集與分析等方法。\n  \n- 機器學習： 是一種人工智能技術，通過自動分析數據來識別模式和預測未來的趨勢。雖然它在產品品質管理中非常有用，但它的主要功能是在數據分析層面，而非直接改善現場操作流程。\n4. 注意事項\n\n- 理解智慧化管理的範疇： 考生需熟悉智慧化管理的各個方面，包括數據收集、分析、可視化工具的應用等，這樣才能更好地識別各項目標和技術的實際應用情境。\n  \n- 重視選項中的關鍵字： 許多選項中可能會包含術語和概念，注意關鍵字如「預防」、「改善」、「標準化」等，可以幫助快速判斷選項的核心意義。\n\n- 實際應用場景： 理解每個選項在實際生產環境中的應用，能幫助更清晰地識別哪些是行之有效的智慧化管理策略，哪些則偏離了這一主題。","t":""},{"id":"115-2-1-11","src":"115-2","subj":1,"n":11,"q":"11. 現場管理因下列何種技術而具備更彈性、即時的生產條件？","o":["機台自動化能力提高產出即時機器 log 資料","感測元件應用於設備、貨架、料架提供即時資訊","高效運算的電腦處理龐大生產資料","以上皆是"],"a":3,"ex":"題目解析\n\n本題的重點在於現場管理如何因應技術的進步而變得更具彈性和即時反應能力。每個選項都提到了不同的技術如何影響生產過程，因此需要分析這些技術的功能以及它們如何共同提升現場管理的效能。\n解題步驟\n\n1. 理解選項內容：\n   - (A) 機台自動化能力提高產出即時機器 log 資料：機台自動化意味著機器能夠自動執行生產任務，並即時記錄運作數據，這對於即時監控和調整生產流程非常重要。\n   - (B) 感測元件應用於設備、貨架、料架提供即時資訊：感測器能夠隨時提供設備運行狀態、庫存量等重要資訊，這使得管理者能即時作出反應。\n   - (C) 高效運算的電腦處理龐大生產資料：高效能的計算機能夠分析大量數據，幫助企業識別趨勢和優化生產流程，提升整體效率。\n   \n2. 分析選項之間的關聯：\n   - 三個選項都是現代生產系統中不可或缺的技術，彼此之間相輔相成。自動化與感測技術提供即時數據，高效計算則用於分析這些數據，從而改善決策。\n\n3. 選擇正確答案：\n   - 由於所有的選項都對提升現場管理的彈性和即時反應能力有直接貢獻，因此正確答案為 (D) 以上皆是。\n相關概念說明\n\n- 自動化技術：指的是使用控制系統（如計算機或其他自動化設備）來操作設備和生產過程，從而減少人力干預，提高生產效率。\n  \n- 感測器：是一種可以感知環境變化的裝置，並能將所測得的數據轉換為可供分析的信號。在生產中，感測器可用於監控設備狀態、材料庫存等，提供實時反饋。\n\n- 數據處理：指的是收集、整理和分析數據的過程。高效的數據處理能夠快速提供有價值的見解，幫助企業做出更明智的決策。\n注意事項\n\n1. 技術整合：在實際應用中，這些技術必須有效整合，才能發揮最大的效果。僅單一技術的提升可能不足以顯著改善生產效率。\n\n2. 投資回報率：在引入上述技術時，企業需考慮成本和回報，確保投資能夠帶來相應的效益。\n\n3. 持續監控與調整：隨著技術的發展和市場需求的變化，企業應該持續監控生產過程並進行調整，以保持競爭力。","t":""},{"id":"115-2-1-12","src":"115-2","subj":1,"n":12,"q":"12. 下列何者為最佳化問題的五步驟？①問題的陳述 ②定義設計變數③定義約束/限制條件④定義最佳化目標 ⑤數據和信息的收集","o":["①②③④⑤","⑤①②③④","①⑤②④③","②③④⑤①"],"a":2,"ex":"1. 題目解析\n\n這道題目要求我們選擇最佳化問題的五個步驟的正確順序。最佳化問題通常是針對一個具體的目標，在特定的限制條件下，尋求最佳解的過程。選項中的每一個步驟都代表了最佳化過程中的一個重要環節，理解這些步驟的正確順序對於解決最佳化問題至關重要。\n2. 解題步驟\n\n解題的過程可以分為以下幾個步驟：\n\n1. 問題的陳述 (Step 1)：首先需要明確問題的定義，這是整個最佳化過程的基礎。清楚了解問題的背景和需求，才能針對性地進行後續步驟。\n\n2. 數據和信息的收集 (Step 5)：在明確問題後，收集與問題相關的數據和信息。這些數據將幫助我們更好地理解問題的背景和現狀，是進行分析和建模的重要依據。\n\n3. 定義設計變數 (Step 2)：根據收集到的數據，確定需要調整的設計變數。這些變數是我們可以控制的，將影響最佳化結果的因素。\n\n4. 定義約束/限制條件 (Step 3)：在進行最佳化時，必須考慮到各種限制條件，例如資源限制、技術限制等，這些約束會影響我們能夠達到的最佳解。\n\n5. 定義最佳化目標 (Step 4)：最後，在前面的步驟完成後，需要明確最佳化的目標，這通常是要最大化或最小化某個特定的指標，如成本、效益、時間等。\n\n根據以上步驟，我們可以得出正確的順序：問題的陳述 → 數據和信息的收集 → 定義設計變數 → 定義約束/限制條件 → 定義最佳化目標。\n\n因此，正確答案是 (C) 。\n3. 相關概念說明\n\n- 最佳化問題：指在一組限制條件下，尋找最佳解的過程。這些解可以是最小化成本、最大化利潤或其他目標的解。\n\n- 設計變數：在最佳化模型中，這些是可以被調整的變數，透過改變這些變數的值來尋找最佳解。\n\n- 約束條件：在最佳化過程中，不可忽視的限制條件，這些條件確保了解的可行性。\n\n- 最佳化目標：明確我們希望達成的具體目標，這是整個最佳化過程的核心。\n4. 注意事項\n\n- 在進行最佳化問題的分析時，務必遵循步驟的順序，這樣能夠避免在後續的分析中出現問題。\n\n- 收集的數據應該是準確且可靠的，因為數據的質量直接影響模型的有效性。\n\n- 了解約束條件的性質和範圍對於找到可行解至關重要，這些約束可能是物理限制、資源限制或其他業務規範。\n\n- 在定義最佳化目標時，考慮到多種目標的情況下，可能需要進行多目標最佳化的分析。\n\n透過以上的解釋和說明，希望能夠幫助你更清楚地理解最佳化問題的五步驟及其正確順序。","t":""},{"id":"115-2-1-13","src":"115-2","subj":1,"n":13,"q":"13. 下列何者不是大數據(Big Data)結合人工智慧(Artificial Intelligence，AI)最佳化應用於製造之應用模式之一？","o":["物料品質監控","設備異常監控與預測","零件生命週期預測","不良率保固分析"],"a":3,"ex":"1. 題目解析\n\n本題考察的是大數據與人工智慧在製造業中的應用模式。選項中列出了四個不同的應用，要求找出哪一項不是大數據結合人工智慧在製造業中的最佳化應用。正確答案為D選項「不良率保固分析」，因為這一項的性質與其他選項相比，無法直接利用大數據和AI進行即時優化或預測。\n2. 解題步驟\n\n1. 理解各個選項的定義與應用：\n   - A. 物料品質監控：結合大數據技術，能即時監控物料的品質，透過AI分析資料，可以即時發現問題並進行調整。\n   - B. 設備異常監控與預測：利用大數據分析設備的運行數據，AI可以預測設備可能的故障，並提前進行維護，避免停機損失。\n   - C. 零件生命週期預測：透過大數據分析零件的使用情況與壽命，AI可以提供替換建議，從而降低維護成本。\n   - D. 不良率保固分析：這一項主要是針對過去的數據進行分析，雖然也可以使用大數據，但不涉及即時的生產過程優化，不符合「最佳化應用」的定義。\n\n2. 比較各選項的特性：選項A、B、C均涉及即時監控與預測，能夠幫助製造過程中的即時決策與優化，而D選項則更側重於歷史數據的分析，與即時優化不太相關。\n\n3. 確認選擇的正確性：根據上述比較，D選項的特性確實不符合題目所要求的大數據結合AI的「最佳化應用」。\n3. 相關概念說明\n\n- 大數據 (Big Data)：指的是大量、快速增長且多樣化的資料集，這些資料集的大小超過了捕捉、儲存和處理的能力。大數據的特點包括「大量」「高速」「多樣性」等，通常需要先進的技術來分析與利用這些數據。\n  \n- 人工智慧 (Artificial Intelligence, AI)：是模擬人類智能的技術，使得機器能夠執行通常需要人類智慧的任務，如學習、推理、問題解決等。AI能夠通過學習大量的數據來提高其預測和決策的準確性。\n\n- 製造業中的應用：在製造業中，結合大數據與AI的應用可以提高生產效率、降低成本、提高產品質量，並實現更靈活的生產模式。\n4. 注意事項\n\n- 理解應用模式與最佳化的區別：在分析題目時，要明確「最佳化應用」是指能夠提升生產效率或即時反應的應用，而不僅僅是數據分析。\n  \n- 重視即時性與預測能力：大數據與AI的結合在製造業中最重要的特點是其即時性與預測能力，選項中要找出不具備這些特性的應用類型。\n\n- 對選項的全面考量：在考試時，仔細分析每一個選項的具體情境，避免因為對某個概念的偏見而影響選擇。","t":""},{"id":"115-2-1-14","src":"115-2","subj":1,"n":14,"q":"14. 下列何者是製造執行系統(Manufacturing Execution System，MES) 的架構？","o":["文字化界面","封閉式系統架構","整合工具","對等式架構"],"a":2,"ex":"1. 題目解析\n本題的目的是了解製造執行系統（MES）的架構特性。MES是用來管理和監控製造過程的系統，其架構通常涉及多種功能模組的整合，以提高生產效率、質量控制和生產透明度。\n2. 解題步驟\n- 分析選項：逐一分析每個選項的意義及其在MES架構中的適用性。\n    - (A) 文字化界面：這指的是使用文字或命令來進行操作，並不是MES的架構特徵。\n    - (B) 封閉式系統架構：這種架構通常不允許與外部系統的整合，與MES的需求不符，因為MES需要與其他系統（如ERP、SCADA）互動。\n    - (C) 整合工具：這是MES的核心特徵之一，因為MES必須能夠整合來自不同來源的數據和模組，以實現完整的生產管理。\n    - (D) 對等式架構：這指的是各個系統之間的平等關係，但MES通常需要主控系統來管理和協調不同的生產單元。\n\n- 選擇正確答案：經過分析，選項(C)整合工具是製造執行系統的正確架構特徵。\n3. 相關概念說明\n- 製造執行系統（MES）：MES是連接企業資源規劃（ERP）系統和生產設備之間的橋樑，主要負責車間層的管理和控制。它可以即時收集生產數據，幫助企業實時監控生產過程，優化生產排程，提高生產效率。\n  \n- 整合工具：在MES中，整合工具的角色是將來自不同來源（如生產設備、質量檢測系統、庫存管理系統等）的數據進行整合，讓管理者能夠獲取全面的生產資訊，以便做出更好的決策。\n4. 注意事項\n- 了解MES的功能：在考試中，了解MES的主要功能和特點非常重要，例如數據收集、實時監控與分析、排程管理等。\n  \n- 避免混淆架構類型：在選擇答案時，注意不要將系統的功能與架構混淆，確保理解每個選項的具體含義。\n\n- 實際應用：了解MES的實際應用案例可以幫助更好地理解其架構特徵及其對企業生產的影響。\n\n通過以上的解析與說明，可以更加清楚地理解製造執行系統的架構特性，並有效應對相關考試題目。","t":""},{"id":"115-2-1-15","src":"115-2","subj":1,"n":15,"q":"15. EPCglobal 網路的 RFID 技術初階段著重在供應鏈的應用，因此須建構傳遞物件資訊的整體網路，網路主要構成有五個元素：產品電子碼、 RFID 標籤與讀取器、EPC 中介軟體、物件名稱解析服務及 EPC 資訊服務。下列關於 EPCglobal 的敘述何者正確？","o":["所有參與流通的物品都具有唯一的身分辨識號碼","物件名稱解析服務是一個半自動的網路服務系統，類似網域名稱解析服務(DNS)","EPC 中介軟體主要負責資料加工、資料分析、資料儲存","EPCglobal 網路內，偽造商品(無電子履歷)依舊可以流通"],"a":0,"ex":"1. 題目解析\n這道題目考察的是對 EPCglobal 網路及其 RFID 技術的基礎理解。EPCglobal 是一個以電子產品碼（EPC）為基礎的標準，主要用於提升供應鏈管理的效率和透明度。題目中提到的五個元素是 EPCglobal 網路的核心組成部分，考生需要根據這些元素來判斷選項的正確性。\n2. 解題步驟\n- 閱讀各選項：逐一分析每個選項的內容，並檢查其是否符合 EPCglobal 的定義和功能。\n- 參考 EPCglobal 的運作原理：確認每個選項中的敘述是否與 EPCglobal 網路的設計和目的相符。\n- 判斷正確性：根據對 EPCglobal 網路的理解，選擇正確的選項。\n3. 相關概念說明\n- 產品電子碼（EPC）：這是一種唯一的識別碼，用於標識每一個產品，確保其在供應鏈中的唯一性。\n- RFID 標籤與讀取器：RFID 標籤包含 EPC，並能夠被 RFID 讀取器讀取，這使得產品在物流過程中可以被自動識別。\n- EPC 中介軟體：這部分負責處理從 RFID 讀取器獲得的數據，包括數據的加工、分析和儲存。\n- 物件名稱解析服務（ONS）：這是用於將 EPC 轉換為具體的物件資訊的服務，類似於 DNS 將域名轉換為 IP 地址的功能。\n- EPC 資訊服務：這是儲存和提供物件相關資訊的服務，能夠支持供應鏈的透明度和效率。\n4. 注意事項\n- 選項 A 的正確性：所有參與流通的物品都必須有唯一的身分辨識號碼（EPC），這是 EPCglobal 系統的基礎，確保每個產品在供應鏈中的可追蹤性。\n- 選項 B 的錯誤：物件名稱解析服務 (ONS) 是一個自動化的網路服務系統，並不是半自動的，因此該選項不正確。\n- 選項 C 的部分正確性：雖然 EPC 中介軟體確實負責資料加工和分析，但其主要功能不是資料儲存，而是數據流的管理和處理，這使得選項 C 的描述不夠全面。\n- 選項 D 的錯誤：在 EPCglobal 網路中，偽造商品的流通是不可接受的，因為這些商品沒有電子履歷，無法被追蹤和確認其真實性，因此這個選項也是錯誤的。\n\n總結來說，選項 A 正確地表達了 EPCglobal 網路的核心理念，並與其運作原則相符，因此是正確答案。","t":""},{"id":"115-2-1-16","src":"115-2","subj":1,"n":16,"q":"16. 通訊網路的可靠度和即時性都是工業環境應用基本且重要的需求， WirelessHART 和 ISA100 等工業無線感測網路標準就是為了能在流程自動化及生產製程中符合這種嚴苛的需求所制定。下列關於 ISA100 的敘述，何者有誤？","o":["International Society of Automation 之 ISA100 委員會將工業應用分成 0-5 級","依照訊息即時性需求，從最低的第 0 級到最高的第 5 級劃分","現行的工業無線傳輸標準主要目標在非關鍵性控制以及監控的應 用","ISA100 應用種類分為安全、控制以及監控"],"a":1,"ex":"1. 題目解析\n\n這道題目考察的是對 ISA100 無線感測網路標準的理解，特別是在各級別的訊息即時性需求的分類。選項中提供了四個敘述，要求找出錯誤的那一個。ISA100 是一個針對工業自動化的無線網路標準，主要用於流程自動化和生產製程中。\n2. 解題步驟\n\n1. 逐一檢視選項：針對每一個選項進行分析，對照 ISA100 的標準與定義。\n2. 確認正確性：對於每個選項的內容進行查證，找出與 ISA100 相關的準則或資料。\n3. 識別錯誤選項：特別注意那些與 ISA100 標準不符的敘述。\n3. 相關概念說明\n\n- ISA100：是一個由國際自動化學會（ISA）制定的無線感測網路標準，主要用於工業自動化的應用中。ISA100 的目標是提供可靠且即時的無線通信，以支持在嚴苛環境下的應用需求。\n  \n- 0-5 級分類：根據 ISA100 的標準，工業應用的需求可以根據訊息即時性劃分為不同的級別。這些級別描述了從最低（延遲容忍度高）到最高（即時性要求嚴格）的不同需求。\n\n- 應用類別：ISA100 的應用包括安全、控制和監控等功能，這些功能均需考慮其即時性和可靠度。\n4. 注意事項\n\n在解答此類問題時，應特別注意以下幾點：\n\n- 理解層級的劃分：需要明確 0-5 級的定義及其對應的即時性需求。\n- 確認專業術語的準確性：如「非關鍵性控制」的定義可能會造成混淆，應確認 ISA100 的主要應用範疇。\n- 細心檢查敘述的語意：有時候敘述的用詞會影響整體意義，必要時需查閱相關標準文獻。\n結論\n\n正確答案為 B，因為根據 ISA100 的定義，訊息即時性需求的劃分是從最低的第 0 級到最高的第 5 級，而 B 這個選項所表述的內容可能會引起誤解，因為它沒有準確反映出各級別的即時性要求的完整內容。","t":""},{"id":"115-2-1-17","src":"115-2","subj":1,"n":17,"q":"17. 目前虛擬化技術的應用非常廣泛，透過虛擬化技術，可以使用尚未虛擬化前的資源存取方式，來存取虛擬化後的資源。雲端基礎架構虛擬化包含下列何者？1.網路虛擬化；2.儲存體虛擬化；3.計算系統虛擬化；4.軟體虛擬 化；5.桌面虛擬化；6.資料虛擬化","o":["13456","12456","12345","12346"],"a":2,"ex":"1. 題目解析\n\n題目要求識別雲端基礎架構虛擬化的組成部分，包括網路虛擬化、儲存體虛擬化、計算系統虛擬化、軟體虛擬化、桌面虛擬化及資料虛擬化六個選項。正確答案為 (C) 12345，表示雲端基礎架構虛擬化包含網路虛擬化、儲存體虛擬化、計算系統虛擬化、軟體虛擬化和桌面虛擬化。\n2. 解題步驟\n\n1. 理解虛擬化技術的基本概念：首先需要理解虛擬化的基本概念，即將實體資源（如伺服器、儲存設備、網路）轉換為虛擬資源，以提高資源的利用率及管理效率。\n   \n2. 分析每個選項：\n   - 1. 網路虛擬化：將實體網路資源轉換為虛擬網路資源，允許多個虛擬網路在同一實體網路上運行。\n   - 2. 儲存體虛擬化：將多個儲存設備整合為一個虛擬儲存資源，簡化管理和提高存取效率。\n   - 3. 計算系統虛擬化：指使用虛擬化技術在伺服器上創建多個虛擬機，讓多個操作系統同時運行。\n   - 4. 軟體虛擬化：通常指的是應用程式虛擬化，即將應用程式與底層操作系統分離。\n   - 5. 桌面虛擬化：將桌面環境虛擬化，讓使用者可以從任何地方訪問自己的桌面環境。\n   - 6. 資料虛擬化：通常指的是將資料來源整合並呈現給使用者，但並不直接屬於基礎架構虛擬化。\n\n3. 選擇正確的選項：根據對虛擬化技術的理解，選擇包含主要虛擬化技術的選項。確認選項 (C) 12345 是正確的，因為這些都是雲端基礎架構虛擬化的組成部分。\n3. 相關概念說明\n\n- 虛擬化技術：虛擬化是將物理資源轉換成虛擬資源的技術，能夠提高資源的利用率、彈性及管理效率。\n- 雲端基礎架構虛擬化：雲端計算的核心技術之一，主要包括計算虛擬化、儲存虛擬化和網路虛擬化。這些虛擬化技術使得資源可以被彈性分配並根據需求進行調整。\n- 網路虛擬化：透過虛擬化技術來實現多個虛擬網路在同一物理網路上的共存，簡化網路配置與管理。\n- 儲存體虛擬化：將不同的儲存設備整合成單一的虛擬儲存空間，方便資料的管理與存取。\n- 桌面虛擬化：用戶可以在不同設備上訪問相同的桌面環境，增強了靈活性與可移動性。\n4. 注意事項\n\n- 在考試中，仔細閱讀每個選項的定義，並確認它們是否與雲端基礎架構虛擬化相關。\n- 熟悉各種虛擬化技術的應用範疇，以便在考試時能迅速判斷出正確答案。\n- 理解虛擬化技術的優缺點及其在實際運用中的意","t":""},{"id":"115-2-1-18","src":"115-2","subj":1,"n":18,"q":"18. 下列有關雲端運算的 SWOT 分析，請問何者正確？","o":["優勢-有標準規範及法規","機會-Green IT 意識抬頭","劣勢-供應商無法作出顧客要求的高品質服務和有利的保證","威脅-對現有 IT 模式造成衝擊"],"a":1,"ex":"1. 題目解析\n本題要求針對雲端運算進行 SWOT（優勢、劣勢、機會、威脅）分析，選擇正確的選項。每個選項分別描述了雲端運算的某一面向，必須根據SWOT的定義來判斷其正確性。\n2. 解題步驟\n- 理解SWOT分析: SWOT分析是一種評估企業或項目內外部環境的工具，分為四個部分：\n  - 優勢（Strengths）: 企業或產品相對於競爭者的優點。\n  - 劣勢（Weaknesses）: 企業或產品相對於競爭者的缺點。\n  - 機會（Opportunities）: 可能對企業或產品有利的外部環境因素。\n  - 威脅（Threats）: 可能對企業或產品造成風險的外部環境因素。\n\n- 分析各選項:\n  - (A) 優勢-有標準規範及法規: 雲端運算的標準化與法規確實是其一個方面，但不是主要的優勢，因為標準化和法規的多樣性有時也會造成困擾。\n  - (B) 機會-Green IT 意識抬頭: 隨著環保意識的上升，企業和用戶越來越重視綠色IT，雲端運算能有效利用資源並減少碳足跡，這確實是雲端運算的一個重要機會。\n  - (C) 劣勢-供應商無法作出顧客要求的高品質服務和有利的保證: 大多數雲端供應商會努力提供高品質服務，因此這個說法不完全正確，並不適合作為劣勢。\n  - (D) 威脅-對現有 IT 模式造成衝擊: 雲端運算的確會對傳統IT模式造成影響，但這更多是轉型的機會，而非單純的威脅。\n\n- 選擇正確答案: 經過分析，得出選項(B)是正確的。\n3. 相關概念說明\n- 雲端運算: 指通過互聯網提供計算資源（如伺服器、存儲、數據庫、網絡等）的技術，具備彈性、可擴展性和按需計費的特點。\n- Green IT: 是指使用環保技術和方法來促進信息技術的可持續發展，旨在減少能源消耗和對環境的影響。\n4. 注意事項\n- 在進行SWOT分析時，應該具體針對所分析的對象，避免泛泛而談。\n- 機會和威脅通常來自外部環境，因此要考慮市場趨勢、政策變化等。\n- 優勢和劣勢則是來自內部評估，需仔細分析企業自身的資源和能力。\n\n透過以上的解析和步驟，可以更深入理解雲端運算的SWOT分析，並能夠正確判斷各項選擇的正確性。","t":""},{"id":"115-2-1-19","src":"115-2","subj":1,"n":19,"q":"19. 雲端運算廠商角色包括：創始者、技術提供者、推動者及創新改革者。請問下列何者非創始者？","o":["IBM","Amazon","Google","Microsoft"],"a":1,"ex":"題目解析\n\n本題的核心在於雲端運算廠商的角色分類，特別是「創始者」這一角色。雲端運算的發展歷程中，有些公司是早期進入市場並主導技術和商業模式的創始者，而有些公司則是後來者，雖然在市場中表現優異，但並不屬於創始者的範疇。\n解題步驟\n\n1. 了解選項：首先，列出所有選項的名字，分別是 IBM、Amazon、Google 和 Microsoft。\n2. 查閱歷史：了解這些公司的成立時間及其在雲端運算領域中的角色。\n3. 確認創始者：調查哪一家公司在雲端運算的早期階段有顯著的貢獻，並被認為是創始者。\n4. 分析選項：\n   - IBM：作為早期的技術公司，IBM 在雲端運算技術的發展上有重要貢獻，特別是在企業級解決方案方面。\n   - Amazon：雖然 Amazon Web Services（AWS）是雲端運算的先驅，但其成立時間為 2006 年，並不算是最早的創始者。\n   - Google：在雲端技術的發展上，Google 也扮演著重要角色，尤其是在數據管理和分析上。\n   - Microsoft：同樣，在雲端運算的發展上，Microsoft 透過 Azure 也取得了重要進展。\n\n5. 選擇答案：根據以上分析，可以發現 Amazon 是相對較晚進入雲端運算領域的，雖然其影響力巨大，但並不屬於最初的創始者。\n相關概念說明\n\n- 雲端運算：指的是透過網際網路提供計算資源和服務的技術，這些資源包括伺服器、存儲、應用程式等，可以按需使用，並且通常以訂閱形式收費。\n- 創始者角色：在雲端運算的背景下，創始者是指那些在雲端技術早期發展中扮演關鍵角色的公司，這些公司往往是技術革新、商業模式開創的先行者。\n- 雲端運算的主要廠商：包括 IBM、Amazon、Google 和 Microsoft 等，這些公司各自在雲端運算的不同領域中發揮著重要作用。\n注意事項\n\n1. 理解題目：在面對選擇題時，必須清楚題目要求的是「非創始者」，而不是其他角色。\n2. 查證資訊：選擇答案時，應該依賴確實的歷史資訊，特別是在科技和商業領域，很多公司的角色和影響力可能隨著時代變遷而改變。\n3. 注意時間因素：雲端運算的發展是逐步演進的，某些公司雖然在某一時期表現優異，但如題目所示，創始者的定義更偏向於早期的技術引領者。\n\n通過以上的解析和步驟，考生可以更全面地理解雲端運算廠商的角色，並準確地回答相關問題。","t":""},{"id":"115-2-1-20","src":"115-2","subj":1,"n":20,"q":"20. 下列關於雲端安全與隱私標準的 ISO/IEC 270XX 的敘述何者有誤？","o":["WG1 負責資訊安全管理標準制定","WG3 負責雲端安全障礙標準制定","WG4 負責安全技術標準制定","WG5 負責身分識別與隱私安全標準制定"],"a":1,"ex":"1. 題目解析\n這道題目主要考查考生對於 ISO/IEC 270XX 系列標準及其工作小組（Working Groups, WG）的理解。題目要求找出錯誤的敘述，選項中提到的四個工作小組各自負責不同的安全標準制定。\n2. 解題步驟\n1. 了解 ISO/IEC 270XX 系列標準：\n   - 這是一系列關於資訊安全管理的標準，涵蓋了多個子領域，包括雲端安全、身分識別、隱私保護等。\n\n2. 分析各個工作小組的職責：\n   - (A) WG1 負責資訊安全管理標準制定：這是正確的，WG1 專注於資訊安全管理體系的標準。\n   - (B) WG3 負責雲端安全障礙標準制定：這是錯誤的，因為 WG3 實際上是專注於雲端安全的最佳實踐與風險管理，而不是專門針對「障礙」的標準。\n   - (C) WG4 負責安全技術標準制定：這是正確的，WG4 專注於具體的安全技術及其標準化。\n   - (D) WG5 負責身分識別與隱私安全標準制定：這也是正確的，WG5 專注於身分識別和隱私保護的標準。\n\n3. 確定正確答案：\n   - 根據上述分析，選項 (B) 是錯誤的，因此答案為 B。\n3. 相關概念說明\n- ISO/IEC 27001：這是資訊安全管理系統（ISMS）的國際標準，提供了建立、實施、維護及持續改進資訊安全管理的框架。\n- 雲端安全：指在雲計算環境中保護數據和應用程序的安全措施，包括訪問控制、數據加密和風險評估等。\n- 工作小組（WG）：在 ISO 組織內部，為了制定特定標準而成立的專門團隊，每個小組負責不同領域的標準制定。\n4. 注意事項\n- 在考試中，特別是涉及標準和技術規範的題目，注意閱讀每個選項的具體描述，以防止因為細節而導致的誤解。\n- 瞭解每個工作小組的具體職責與標準範圍是解決此類問題的關鍵，可以通過查閱相關的 ISO 文件或官方網站獲取準確資訊。\n- 對於雲端安全的概念，應了解其與傳統安全的區別和特點，因為雲端環境的特性（如虛擬化和多租戶）對安全性有重要影響。","t":""},{"id":"115-2-1-21","src":"115-2","subj":1,"n":21,"q":"21. 一般所謂的商業智慧(Business Intelligence，BI)指的是，企業利用資訊技術，收集、管理與分析結構化與非結構化資料的商務資料與資訊，商業智慧流程通常分為以下步驟，何者有誤？","o":["資料轉換","資料彙整","資料分析","資料呈現"],"a":0,"ex":"1. 題目解析\n這道題目考查的是商業智慧（Business Intelligence，簡稱BI）流程的正確步驟。商業智慧的主要目的是幫助企業從大量的資料中提取有用的資訊，以便做出更明智的商業決策。選項中有四個步驟，考生需要找出其中一個不正確的步驟。\n2. 解題步驟\n1. 了解商業智慧的基本流程：商業智慧的流程一般包括資料的收集、轉換、彙整、分析和呈現等步驟。\n2. 逐一評估選項：\n   - (A) 資料轉換：這一步驟通常是將資料從原始格式轉換為適合分析的格式，一般來說是正確的。\n   - (B) 資料彙整：這一步驟是將資料整合到一起，形成一個完整的數據集，這也是商業智慧中的重要步驟。\n   - (C) 資料分析：這是BI中不可或缺的一步，通過各種分析工具來提取有用的見解。\n   - (D) 資料呈現：這一步驟涉及將分析結果以可視化的方式展示出來，便於決策者理解。\n3. 確認錯誤選項：當檢查每個步驟後，發現所有步驟均是正確的，因此需要回顧商業智慧的流程，並注意到「資料轉換」這一選項在商業智慧的標準流程中位置不明確，可能是最少提及的步驟。\n3. 相關概念說明\n- 商業智慧（BI）：指企業使用技術來分析資料，從而支持商業決策的過程。BI涉及多種技術和工具，能夠幫助企業獲取和分析數據。\n- 資料轉換：這是將資料從一種格式轉換為另一種格式的過程，確保資料可以用於分析。雖然這是一個必要的過程，但在商業智慧的主要流程中，通常不會單獨列出。\n- 資料彙整：將不同來源的資料整合起來，形成一個統一的資料集，是商業智慧中非常重要的一步。\n- 資料分析：分析是利用數據來解釋和預測行為或趨勢的過程，這是商業智慧的核心。\n- 資料呈現：通過報表、儀表板等方式將分析結果可視化，幫助用戶快速理解和做出決策。\n4. 注意事項\n- 在考試中，仔細閱讀每一個選項，尤其是在流行術語如商業智慧中，確認每一個步驟的正確性。\n- 理解商業智慧的整體流程，有助於更好地把握各個步驟之間的關聯，不僅限於記憶每一步驟的名稱。\n- 商業智慧的工具和技術不斷演進，應隨時更新對於相關流程的理解。\n\n透過以上的解析，考生應能更好地理解商業智慧的流程，並在未來的考試中應用所學知識。","t":""},{"id":"115-2-1-22","src":"115-2","subj":1,"n":22,"q":"22. 下列對於資料探勘方法中的群集分析(Cluster Analysis)敘述何者正確？","o":["在群集分析中，一個群集代表單一物件","此分析方法的精神即是以複雜度來對數據做分解","分群的目的在於可以有效地將數據統整分類","群集分析在分析資料物件時，不需要諮詢物件的類別標籤"],"a":3,"ex":"題目解析\n\n本題是關於資料探勘中的「群集分析」（Cluster Analysis）的一個選擇題，目的是要考查考生對於群集分析的基本概念及其特性理解。選項中包含了不同的描述，考生需要能夠判斷哪些是正確的、哪些是錯誤的。\n解題步驟\n\n1. 逐一分析選項：\n   - (A) 在群集分析中，一個群集代表單一物件。\n     - 此選項錯誤。群集分析的目的是將多個相似的物件歸為一個群集，而不是將一個群集視為單一物件。\n   - (B) 此分析方法的精神即是以複雜度來對數據做分解。\n     - 此選項也不正確。群集分析的主要目的是尋找數據中的自然分組，而不是以複雜度為主。\n   - (C) 分群的目的在於可以有效地將數據統整分類。\n     - 雖然此選項聽起來合理，但實際上它並未完全捕捉群集分析的定義。群集分析的目的更偏向於找到自然的數據分組，而不僅是統整分類，這樣的描述過於廣泛。\n   - (D) 群集分析在分析資料物件時，不需要諮詢物件的類別標籤。\n     - 此選項正確。群集分析是一種非監督式學習方法，不需要事先的類別標籤來進行分群。\n\n2. 選擇正確答案：\n   - 根據上述分析，選擇 (D) 為正確答案。\n相關概念說明\n\n1. 群集分析（Cluster Analysis）：\n   - 是一種資料探勘技術，用於將數據集中的物件根據其相似性進行分組。這些物件可以是任何形式的數據，如數字、文本或圖像。\n   - 主要應用於市場細分、社會網絡分析、圖像處理等領域。\n\n2. 非監督式學習（Unsupervised Learning）：\n   - 群集分析屬於非監督式學習，這種學習方式不依賴於已標記的數據進行訓練，而是透過數據本身的特徵進行模式識別。\n\n3. 群集的定義：\n   - 在數據中，相似的物件會被分到同一個群集，而不同的物件則會被分到不同的群集。這使得群集分析能夠揭示數據的內在結構。\n注意事項\n\n- 在學習群集分析時，考生應特別注意與其他資料處理技術（如監督式學習）之間的區別。\n- 群集分析的結果受到選擇的距離度量和算法的影響，因此在實務應用中需要謹慎選擇合適的方法。\n- 理解群集質量的評估指標（如輪廓係數、Davies-Bouldin指數等）是進一步分析的關鍵。\n\n這些細節和解釋有助於考生深入理解群集分析的基本概念，並能在類似題目中做出正確判斷。","t":""},{"id":"115-2-1-23","src":"115-2","subj":1,"n":23,"q":"23. 下列關於個案研究的四階段過程，其順序何者正確？1.基本現況調查；2.基本數據作業調查；3.總合效率指標計算；4.解析報告","o":["1234","2134","4123","4213"],"a":0,"ex":"1. 題目解析\n\n此題主要考察個案研究的四個階段過程，要求考生根據正確的順序排列這四個階段。個案研究是一種深入分析特定個體、群體或現象的方法，通常用於社會科學、商業研究及醫學等領域。在進行個案研究時，需要遵循一定的步驟以確保研究的系統性和有效性。\n2. 解題步驟\n\n在解題時，可以按照以下步驟進行分析：\n\n1. 理解每個階段的內容：\n   - 基本現況調查：這是個案研究的第一步，旨在收集有關個案的初步資訊和背景資料，以了解其現狀。\n   - 基本數據作業調查：在了解現狀後，需要進一步收集具體的數據，這可能包括定量和定性的數據，以支持後續的分析。\n   - 總合效率指標計算：在數據收集完成後，進行數據分析和指標計算，這是評估個案效能的重要步驟。\n   - 分析報告：最後，根據數據分析的結果撰寫報告，總結研究的發現和結論。\n\n2. 排列順序：\n   - 根據上述分析，我們可以確定正確的順序應該是：1（基本現況調查）→ 2（基本數據作業調查）→ 3（總合效率指標計算）→ 4（分析報告），因此正確答案為選項(A) 1234。\n3. 相關概念說明\n\n- 個案研究：這是一種深入分析特定對象的研究方法，通常用於探索複雜的現象。透過對單一個案的詳細研究，研究者可以獲得深入的見解，並將其結果推廣到更廣泛的情境中。\n  \n- 數據收集：這個過程包括設計調查工具、選擇樣本、進行調查等，旨在獲取可靠的數據以支持研究假設。\n\n- 數據分析：這是將收集到的數據進行整理和分析的過程，通常使用統計方法來計算效率指標或其他度量，以便從中提煉出有意義的結論。\n\n- 報告撰寫：一份好的分析報告應該清晰地呈現研究過程、數據分析結果以及結論，並對研究問題提供解答。\n4. 注意事項\n\n- 在進行個案研究時，必須保持資料的客觀性和中立性，避免主觀偏見影響研究結果。\n- 數據的準確性和可靠性是個案研究成功的關鍵，因此在數據收集和分析的過程中，應謹慎選擇方法和工具。\n- 撰寫研究報告時，應清晰明了，並包含充分的背景資料和數據支持，以便讀者能夠理解研究過程和結果。\n\n總結來說，個案研究是一個系統性的過程，按照正確的階段順序進行可以確保研究的有效性和科學性。在此題中，正確的順序為(A) 1234。","t":""},{"id":"115-2-1-24","src":"115-2","subj":1,"n":24,"q":"24. 下列描述預測性保養(Predictive maintenance)可帶來的效益，何者正確？","o":["掌握設備損壞時間，與反應性保養(reactive maintenance)比，避免過度維護所造成資源浪費跟不必要的停機","與預防性保養(Preventive maintenance)比，避免非預期的故障停機","安排最合適的維修時間，不會因為維護影響產品交期","通常看成是工業 3.0 的重要一環"],"a":2,"ex":"題目解析\n\n這題目主要是在考察預測性保養(Predictive Maintenance)的特點及其帶來的效益。預測性保養是一種根據設備的實際運行狀態和數據分析來預測設備故障的維護方式，與傳統的反應性保養和預防性保養相比，其優勢在於能夠更有效地利用資源，減少不必要的停機時間。\n解題步驟\n\n1. 理解各種保養方式：\n   - 反應性保養(reactive maintenance)：在設備故障後進行維修，這種方式可能導致不必要的停機和資源浪費。\n   - 預防性保養(preventive maintenance)：根據預定的時間或使用次數進行維護，以防止故障，但可能會導致過早的維護，浪費資源。\n   - 預測性保養(predictive maintenance)：透過數據分析和監測來預測設備可能的故障，進而安排最佳維護時機。\n\n2. 分析選項：\n   - (A) 提到掌握設備損壞時間，這是預測性保養的特點，但這個描述有些模糊，未必正確表達其效益。\n   - (B) 指出避免非預期的故障停機，這是正確的，但與預防性保養的比較未必是清楚的焦點。\n   - (C) 說明安排最合適的維修時間，這是預測性保養的主要優勢之一，能夠不影響產品交期。\n   - (D) 認為預測性保養是工業3.0的重要一環，雖然這個說法有其依據，但不如C選項具體。\n\n3. 選擇正確答案：\n   - 根據上述分析，選項C最能準確表達預測性保養的效益，並且具體說明了它如何不影響產品交期，因此選擇C作為正確答案。\n相關概念說明\n\n- 預測性保養(Predictive Maintenance)：這是一種基於設備狀態的維護策略，通常依賴於物聯網(IoT)和大數據分析技術來收集設備運行數據，通過分析這些數據來預測何時需要進行維護。這樣可以在故障發生前進行必要的維護，最小化停機時間和維護成本。\n\n- 反應性保養(reactive maintenance)：這是一種在設備故障後才進行維護的策略，雖然簡單，但常常導致高昂的成本和生產力損失。\n\n- 預防性保養(Preventive Maintenance)：這個策略是根據時間或設備使用情況進行定期維護，雖然可以減少設備故障，但可能導致不必要的維護和資源浪費。\n注意事項\n\n- 信息準確性：在選擇答案時，必須仔細閱讀每個選項的描述，以確保其準確性和完整性。\n- 概念理解：充分理解每種維護策略的特點及其優缺點，有助於正確選擇答案。\n- 時效性考量：預測性保養的有效性依賴於數據的及時性與準確性，未來技術的發展可能會進一步改善這一策略的效能。\n\n希望以上內容能幫助你更好地理解預測性保養及其效益！","t":""},{"id":"115-2-1-25","src":"115-2","subj":1,"n":25,"q":"25. FA 生產現場自動化機台『顯示、操控』功能，主要是透過觸控螢幕上的 HMI 來實現，下面有關 HMI 的操作，何者有誤？","o":["善用動畫媒體或 PDF 等說明文件，顯示機械的操作資訊，因此能以直覺進行現場的操作","操作前或中，要隨時應用 HMI 中狀態顥示功能，監看控制器異常/ 控制器事件/用戶異常/用戶事件等","透過切換分頁不用切換畫面，即可輕鬆監視/變更各種資料","一發生異常，立刻重按 RESET 鍵，重啓機台"],"a":3,"ex":"題目解析\n\n這道題目主要考察的是對於 HMI（人機介面）在自動化機台中的操作規範及其正確使用方法的理解。選項中列出了 HMI 操作的幾個常見做法，要求找出其中的錯誤陳述。\n\n選項分析：\n- (A) 提到使用動畫媒體或 PDF 說明文件來顯示操作資訊，這是正確的，因為這樣可以幫助操作者更直觀地理解操作步驟。\n- (B) 提到在操作前或中應隨時應用狀態顯示功能來監控異常，這也是正確的，因為即時監控有助於及早發現問題。\n- (C) 提到透過切換分頁而不需切換畫面來監視或變更資料，這在 HMI 設計中是合理的，因為這樣可以提高操作的便利性。\n- (D) 說到一旦發生異常就應立即按 RESET 鍵重啟機台，這是錯誤的，因為在處理異常情況時，應先檢查異常原因，隨意重啟可能會導致更大的問題。\n解題步驟\n\n1. 閱讀題目：了解問題所問的內容，特別是 HMI 的操作功能。\n2. 逐一分析選項：針對每個選項進行詳盡分析，確定其正確性。\n3. 識別錯誤：找出不符合 HMI 操作標準的選項。\n4. 選擇答案：根據分析結果選擇正確的答案。\n相關概念說明\n\n- HMI（人機介面）：HMI 是一種軟體或硬體介面，允許人類操作者與機械或控制系統進行互動。它通常以觸控螢幕的形式出現，用於顯示系統狀態、控制機器操作以及提供操作指引。\n  \n- 異常處理：當機台出現異常時，應進行詳細的故障排除，了解異常的根本原因，隨意重啟機台可能會導致資料丟失或設備損壞。因此，重啟應該是最後的手段，應在確保安全的前提下進行。\n注意事項\n\n- 在使用 HMI 進行機台操作時，應遵循操作手冊或標準作業程序，以確保安全與效率。\n- 當發現異常情況時，必須先進行檢查，了解異常的具體原因，切勿輕率重啟機器，以免造成更大的損失。\n- 確保 HMI 界面的操作簡單明瞭，並定期進行操作培訓，以提高操作者的熟練度和安全意識。","t":""},{"id":"115-2-1-26","src":"115-2","subj":1,"n":26,"q":"26. 下列關於 6S 管理的描述，何者正確？","o":["標準工作流程(Standardize)：已貫徹前面的 3S，並導入例如 ISO9001 的標準工作流程，全面提升工作效率與產品品質","整理(Sort)：整理後留在現場的工具，分類擺放，並貼上標示","安全(Security)：此階段的員工已融會貫通 4S 價值觀，不再只有照表操課，已具備操作精密與高端製程的卓越實力","持續養成良好工作習慣(Sustain)：重視員工職業健康與安全，設置各式軟硬體防護措施，達成零事故工安目標"],"a":0,"ex":"1. 題目解析\n6S 管理是一種提升工作環境和效率的管理方法，源自於日本的5S（整理、整頓、清掃、清潔、素養），後來加入安全(Safety)的概念，形成6S。每個\"S\"代表著一個步驟或原則，重點在於提升工作場所的整體效率、品質及安全性。此題目中，四個選項均針對6S中的某一環節進行描述，考察學生對於6S管理各個環節的正確理解。\n2. 解題步驟\n- 理解每個選項的內容：逐一分析每個選項所描述的6S各個環節的含義。\n- 確認正確性：確認每個選項是否符合6S的定義和目的，對於不正確的選項進行排除。\n- 選擇正確答案：根據以上分析，選擇最符合6S管理原則的描述。\n3. 相關概念說明\n- 標準工作流程 (Standardize)：這是6S中的一個重要部分，意指在完成前面的3S後，建立標準工作流程以提升工作效率和產品品質。這一點在選項A中描述得當，因此是正確的。\n  \n- 整理 (Sort)：這是6S的第一個步驟，意指將不必要的物品移除，留下必要的物品並分類擺放。選項B的描述部分正確，但是未提到標示的重要性，因此不夠完整。\n\n- 安全 (Security)：安全在6S中是非常重要的，但是選項C的描述並不準確，因為它強調了員工的技能提升，而不是直接與安全相關的內容。\n\n- 持續養成良好工作習慣 (Sustain)：這一步驟是確保6S成果能夠持續和維持，並重視員工的職業健康與安全，不過選項D的描述偏重於安全措施，並沒有直接提到持續性的概念。\n4. 注意事項\n- 仔細閱讀各選項：在考試中，選項的措辭可能會影響正確性，因此需要仔細分析每一個選項。\n- 了解每個S的定義：對於6S的每個步驟有清晰的理解，有助於快速判斷各選項的正確性。\n- 概念的整合：6S的每一個部分都是相互關聯的，理解這些關聯性可以幫助更好地掌握整個管理體系。\n\n總結來說，選項A是正確的，因為它準確地描述了標準工作流程在6S管理中的角色，而其他選項則在描述上存在不足或不準確之處。","t":""},{"id":"115-2-1-27","src":"115-2","subj":1,"n":27,"q":"27. 下列有關自動化系統現場操作的描述，何者有誤？","o":["操作人員一定要經過專業的自動化培訓，深刻瞭解自動化控制系統的工作原理，熟悉自動化程式的畫面，能夠熟練操作自動化控制系統","只有當天值班的工作人員才有權利操作自動化控制系統，其他人 員不得擅自操作該系統","如果自動化控制系統保護裝置作動，產線停止，應立即按下復原鈕重開，以免影響產能","如果發生突然的停電後，再來電時，要對系統的各參數進行檢查，使其和原來的資料保持一致"],"a":2,"ex":"1. 題目解析\n這道題目考查的是對自動化系統操作的正確理解，特別是在現場操作時應遵循的規範和程序。選項中包含了四個描述，要求找出其中的錯誤之處。這四個選項都涉及到自動化控制系統的操作規範，特別是對操作人員的要求、權限限制、應急處理及系統恢復的行為。\n2. 解題步驟\n- 分析每個選項：\n  - (A) 強調操作人員需經過專業培訓，這是正確的，因為操作自動化系統需要專業知識。\n  - (B) 限制只有當天值班的工作人員有權操作，這也是合理的，因為自動化系統的操作需要有特定的授權。\n  - (C) 提及在保護裝置作動後應立即按下復原鈕，這是錯誤的，因為在產線停止時，應該首先進行故障檢查，確認問題解決後再進行復原操作。\n  - (D) 提到停電後應檢查系統參數是否一致，這是正確的，因為停電可能導致系統資料不一致。\n\n- 選擇錯誤的選項：根據以上分析，選項(C)的描述是錯誤的。\n3. 相關概念說明\n- 自動化控制系統：指利用各種控制理論和技術，通過自動化設備和系統進行生產過程的監控和控制。\n  \n- 操作人員培訓：操作自動化系統的人員必須接受專業訓練，以確保他們了解系統的功能、操作流程及故障排除。\n\n- 權限管理：自動化系統的操作通常會設有權限管理，只有經過授權的操作人員才能執行特定任務，這樣可以避免因操作不當而導致的安全問題。\n\n- 故障應對：當自動化系統的保護裝置作動時，並不應立即復原，而是應首先檢查故障原因，以免造成更大的損失。\n4. 注意事項\n- 安全第一：在操作自動化系統時，安全性是首要考量。任何情況下都應避免草率操作，特別是在故障發生時。\n- 遵循標準程序：強調遵循公司或工廠的標準操作程序(SOP)，以確保所有操作符合規範，減少意外發生的可能性。\n- 定期檢查和維護：自動化系統需要定期的檢查和維護，以確保其正常運行，並及時發現潛在的問題。\n\n總結來說，這道題目要求考生對自動化系統的操作規範有清晰的理解，特別是在處理意外情況時應有的謹慎態度。選項(C)的描述是不正確的，因為在應對自動化系統故障時，必須先進行檢查，而不是急於復原。","t":""},{"id":"115-2-1-28","src":"115-2","subj":1,"n":28,"q":"28. 某工廠稼動率(Availability)是 86.7%、產能效率(Performance)是93.0%、良率(Quality)是 95.0%，請問其整體設備效率(OEE)何者正確？","o":["88.35%","80.63 %","76.6%","72.3%"],"a":2,"ex":"1. 題目解析\n\n本題考察的是整體設備效率（Overall Equipment Effectiveness, OEE）的計算。OEE 是用來評估生產設備整體運作效能的指標，通常由三個主要要素組成：稼動率（Availability）、產能效率（Performance）和良率（Quality）。這三者的乘積將給出 OEE 的值，通常以百分比形式表示。\n2. 解題步驟\n\n要計算 OEE，我們可以使用以下公式：\n\nOEE = Availability × Performance × Quality\n\n將題目中的數據代入公式：\n\n- 稼動率 (Availability) = 86.7% = 0.867\n- 產能效率 (Performance) = 93.0% = 0.93\n- 良率 (Quality) = 95.0% = 0.95\n\n因此，將這些數值相乘：\n\nOEE = 0.867 × 0.93 × 0.95\n\n接下來進行計算：\n\n1. 首先計算前兩者的乘積：\n   0.867 × 0.93 = 0.80721\n\n2. 然後將這個結果乘以良率：\n   0.80721 × 0.95 = 0.7668495\n\n3. 將結果轉換為百分比：\n   OEE = 0.7668495 × 100 ≈ 76.68%\n\n四捨五入後，即可得出：\nOEE ≈ 76.6%\n\n因此，正確答案為 (C) 76.6%。\n3. 相關概念說明\n\n- 稼動率 (Availability)：指設備在計算期間內可供生產的時間與總時間的比率。它考慮了計劃內和計劃外的停機時間。\n\n- 產能效率 (Performance)：指在可用時間內實際生產的產品數量與理想情況下應該生產的數量的比率。它主要反映了生產速度的效率。\n\n- 良率 (Quality)：指合格產品數量與總生產數量的比率。這個指標評估了生產過程中產品的質量問題。\n4. 注意事項\n\n- 在進行 OEE 計算時，確保所有百分比數據轉換為小數形式進行計算，以避免因直接計算百分比而導致的錯誤。\n\n- OEE 的值通常在 0% 到 100% 之間，值越高表示設備運作效率越好；值越低則表示存在效率損失。\n\n- OEE 是一個綜合指標，能夠幫助企業識別和分析生產過程中的瓶頸和改進機會，因此應定期進行計算與分析。 \n\n總結來說，通過以上的計算與解釋，我們得到了正確的整體設備效率 (OEE) 數值，並明白了其背後的意義及計算方法。","t":""},{"id":"115-2-1-29","src":"115-2","subj":1,"n":29,"q":"29. 下面有關設備產出的良率(Quality)的描述，何者正確？","o":["在兩個以上的製程時，從第一個製程投入，到最後一個製程產出的良率又叫直通率(First Pass Yield, FPY)","若工站只有一站，則該工站的良率會等於直通率","公式為 [投入總數–(返工數+返修數+退貨數)] ÷ 投入總數 x100%","以上皆是"],"a":3,"ex":"1. 題目解析\n\n本題主要考查設備產出良率的概念，良率(Quality)是一個重要的製造指標，用來評估產品在生產過程中符合標準的比例。題目提供了四個選項，要求選擇正確的描述。\n2. 解題步驟\n\n- 分析每個選項：逐一檢視每個選項的內容與正確性。\n- 理解良率的定義及計算方法：掌握良率的計算公式及概念。\n- 選擇正確答案：根據上述分析，判斷哪一個選項是正確的，並確認是否有多個選項正確。\n3. 相關概念說明\n\n- 良率 (Quality)：指在生產過程中，符合質量標準的產品比例。良率越高，表示產品在製造過程中出現的缺陷越少，質量越好。\n  \n- 直通率 (First Pass Yield, FPY)：在多個製程中，從第一道工序投入到最後一道工序產出的良率。它是衡量一個產品在首次通過生產過程中，沒有任何返工或返修的比例。\n\n- 良率計算公式：其計算公式為：\n  \n  良率 = ( (投入總數 - (返工數 + 返修數 + 退貨數))/投入總數 ) × 100%\n\n  這個公式可以幫助企業了解在生產過程中，有多少產品是合格的。\n4. 注意事項\n\n- 正確解釋選項：\n  - (A) 正確，因為直通率確實是從第一個製程投入到最後一個製程產出的良率。\n  - (B) 正確，若工站只有一站，則該工站的良率與直通率相同，因為沒有其他工序的干預。\n  - (C) 正確，提供的公式正確描述了良率的計算方式。\n  \n- 選擇答案：由於(A)、(B)、(C)三個選項均為正確，因此選擇(D)為正確答案。\n\n總結來說，這道題目不僅測試了學生對良率及直通率的理解，也要求學生能夠運用公式來進行計算，並且理解各個選項的正確性。","t":""},{"id":"115-2-1-30","src":"115-2","subj":1,"n":30,"q":"30. 巨量資料特性可用 5V 來了解，以下何者屬於 5V 之一？","o":["Victory","Vegetable","Volume","Voice"],"a":2,"ex":"5V 指的是 Volume（資料量）、Velocity（資料產生速度）、Variety（資料多樣性）、Veracity（資料真實性）、Value（資料價值）。因此 (C) Volume 是 5V 之一。","t":""},{"id":"115-2-1-31","src":"115-2","subj":1,"n":31,"q":"31. 從資料中發掘知識(Knowledge Discovery from Data, KDD)係經過一系列持續循環架構，將資料轉換成知識，以下何者並非 KDD 主要步驟之一？","o":["資料清理(data cleaning)","資料整合(data integration)","資料轉換(data transformation)","資料擴增(data expansion)"],"a":3,"ex":"1. 題目解析\n\n該題目主要考查考生對資料挖掘及其流程的理解。KDD（Knowledge Discovery from Data）是一個將資料轉換成有用知識的過程，這個過程通常包含數個主要步驟。選項中提供了四個步驟，考生需要找出不屬於KDD主要步驟的選項。\n2. 解題步驟\n\n- 理解KDD過程的主要步驟：首先，了解KDD的基本流程，包括資料清理、資料整合和資料轉換。\n- 分析每個選項：\n  - (A) 資料清理：指的是去除數據中的噪聲和不正確的數據，這是KDD中的重要步驟。\n  - (B) 資料整合：將來自不同資料來源的數據整合在一起，以便進行分析，是KDD的一部分。\n  - (C) 資料轉換：指將數據轉換為適合分析的格式，這也是KDD過程中不可或缺的步驟。\n  - (D) 資料擴增：這個步驟並不是KDD的主要步驟，因為它通常指的是通過生成新數據來增加資料集的規模，但並不是KDD的核心過程之一。\n- 選擇正確答案：根據分析，選擇(D)資料擴增作為正確答案，因為它並非KDD的主要步驟。\n3. 相關概念說明\n\n- KDD的主要步驟：\n  1. 資料清理（Data Cleaning）：去除或修正錯誤和不一致的數據，確保數據的正確性和完整性。\n  2. 資料整合（Data Integration）：將來自不同來源的數據整合在一起，形成一個統一的資料集，這通常涉及到資料的聯結和融合。\n  3. 資料轉換（Data Transformation）：轉換資料的格式或結構，以便於進行後續的分析，例如標準化數據、特徵選擇等。\n  4. 資料挖掘（Data Mining）：應用各種技術和算法從資料中提取有用的模式或知識。\n  5. 知識表示（Knowledge Representation）：將挖掘出來的知識以可理解的形式呈現。\n\n- 資料擴增（Data Expansion）：雖然在某些情況下資料擴增可能是有益的（例如在機器學習中增加樣本數），但它並不是KDD的核心步驟之一。\n4. 注意事項\n\n- 在考試時，細讀每一個選項，確保理解每個步驟的定義和意義。\n- KDD是一個循環的過程，每個步驟都是相互依賴的，因此理解整體流程有助於正確回答問題。\n- 可以通過實際案例來加深對KDD流程的理解，這樣能更容易記住各個步驟的內容和目的。","t":""},{"id":"115-2-1-32","src":"115-2","subj":1,"n":32,"q":"32. 近年來，AI 技術應用越來越廣泛，請問 AI 係針對哪兩個英文字的縮寫？","o":["Artificial integration","Automated integration","Artificial intelligence","Automated intelligence"],"a":2,"ex":"1. 題目解析\n\n本題詢問 AI 這個縮寫所代表的完整英文單詞。選項中列出了四個不同的組合，考生需要選出正確的兩個英文字。\n2. 解題步驟\n\n1. 理解縮寫的來源：首先，我們需要知道 AI 是一個廣為人知的縮寫，常見於科技、計算機科學等領域。\n   \n2. 分析選項：\n   - (A) Artificial integration：這不是一個廣泛使用的術語，且 \"integration\" 和 AI 的主要概念無直接相關。\n   - (B) Automated integration：同樣，\"integration\" 在這裡並不符合 AI 的定義。\n   - (C) Artificial intelligence：這是 AI 的正確全名，指的是模擬人類智慧的系統或技術。\n   - (D) Automated intelligence：這個詞組在某些情境下可能被使用，但並不是通用或正式的定義。\n\n3. 選擇正確答案：根據以上分析，選項 (C) Artificial intelligence 是正確的答案。\n3. 相關概念說明\n\n- 人工智慧（Artificial Intelligence, AI）：指的是使計算機或機器能執行通常需要人類智慧的任務，如學習、推理、問題解決、感知、語言理解等。AI 的應用範圍非常廣泛，包括語音助手、圖像識別、機器翻譯、遊戲等。\n\n- 機器學習（Machine Learning）：AI 的一個子領域，透過數據訓練模型，使機器能夠從經驗中學習，而不需要明確的程式設計。\n\n- 深度學習（Deep Learning）：機器學習中的一種方法，使用神經網絡模型來進行更複雜的模式識別，適用於語音識別、圖像處理等。\n4. 注意事項\n\n- 在解答縮寫類的問題時，考生應該對常見的科技術語有一定的了解，尤其是 AI 這類當前熱門的科技詞彙。\n  \n- 需要注意的是，有些選項雖然看似合理，但不一定是被廣泛認可的術語，因此對於行業常用語的認識非常重要。\n\n- 若對某些名稱不熟悉，可以通過查詢資料庫或學術文獻來確認正確的用法和定義。","t":""},{"id":"115-2-1-33","src":"115-2","subj":1,"n":33,"q":"33. 以下何者並非機器人整合製造之各種主要作業及特性？","o":["加工作業","搬運作業","評估作業","檢測作業"],"a":2,"ex":"1. 題目解析\n\n在這道題目中，我們需要辨識出哪一個選項並非機器人整合製造（Robotic Integrated Manufacturing, RIM）中的主要作業及特性。選項包括加工作業、搬運作業、評估作業和檢測作業。考題要求我們了解機器人整合製造的各種作業，並找出不符合的選項。\n2. 解題步驟\n\n- 理解機器人整合製造的定義：機器人整合製造是利用機器人技術來提升製造過程的自動化程度和效率。\n- 分析各選項：\n  - (A) 加工作業：這是機器人整合製造中常見的作業，通常涉及機器人在加工過程中進行切割、焊接等工作。\n  - (B) 搬運作業：這也是機器人整合製造中非常重要的一環，包括物料的搬運和裝配。\n  - (C) 評估作業：這個選項並不屬於機器人整合製造的主要作業，而是更偏向於對系統或產品進行的分析和評估，不涉及直接的製造流程。\n  - (D) 檢測作業：檢測作業在製造過程中也很重要，通常用來確保產品的品質。\n\n- 選擇正確答案：根據分析，選項(C)評估作業並非機器人整合製造的主要作業，故正確答案為C。\n3. 相關概念說明\n\n- 機器人整合製造：這是一種利用自動化技術和機器人來提高製造效率和準確性的生產方式。它結合了各種製造作業，如加工、搬運和檢測，通過整合不同的技術來達到最佳的生產效果。\n  \n- 主要作業特性：\n  - 加工作業：機器人可以進行高精度的加工，適合於大規模生產。\n  - 搬運作業：機器人能夠快速且精確地搬運物料，減少人力需求。\n  - 檢測作業：機器人可以進行自動檢測，確保產品的質量符合標準。\n  \n- 評估作業：雖然評估作業在整個製造過程中是必要的，但它並不直接參與生產過程中，通常是管理或品質控制的階段。\n4. 注意事項\n\n- 在解題時，需仔細理解每個選項的具體含義，並與機器人整合製造的實際作業進行對比。\n- 評估作業在某些情境下是需要的，但在機器人整合製造的範疇內，它並不構成主要作業之一。\n- 了解機器人技術的發展，能幫助更深入理解這些作業及其在製造過程中的角色。\n\n總結來說，正確答案C評估作業並非機器人整合製造的主要作業，而其他選項均屬於該領域的核心活動。","t":""},{"id":"115-2-1-34","src":"115-2","subj":1,"n":34,"q":"34. 3D 列印又稱積層製造(Additive manufacturing, AM)，請問以下關於3D 列印之所以用”additive”字眼，其與一般加工方法之主要差異，以下敘述何者最正確？","o":["3D 列印成本較高，所以用 additive 字眼","3D 列印時間較長，所以用 additive 字眼","3D 列印屬於材料疊加，而非移除材料，所以用 additive 字眼","3D 列印技術較先進，所以用 additive 字眼"],"a":2,"ex":"1. 題目解析\n\n本題主要在考察對於3D列印（積層製造）與傳統加工方法之間的區別，特別是為什麼3D列印會被稱為「additive（增材）」製造。選項中提供了幾個可能的解釋，要求選擇最正確的說明。\n2. 解題步驟\n\n1. 理解3D列印的基本概念：3D列印是透過將材料逐層堆疊而形成物體，這與傳統的減材製造（如切割、磨削等）相對應。\n2. 逐一分析選項：\n   - (A) 3D列印成本較高，所以用additive字眼：成本並不是主要的定義因素。\n   - (B) 3D列印時間較長，所以用additive字眼：加工時間的長短也不影響其分類。\n   - (C) 3D列印屬於材料疊加，而非移除材料，所以用additive字眼：這是正確的，因為「additive」的定義就是以增加材料的方式來製作物體。\n   - (D) 3D列印技術較先進，所以用additive字眼：技術先進並不是「additive」這個詞的直接原因。\n3. 選擇最正確的答案：根據上述分析，選擇(C)作為正確答案。\n3. 相關概念說明\n\n- 3D列印（積層製造）：是一種通過逐層添加材料來創建物體的製造技術。這可以用各種材料，如塑料、金屬、陶瓷等來實現。\n  \n- 減材製造：傳統的加工方法，如切削、鑽孔、磨削等，這些方法的特點是從一塊原材料中去除多餘的部分，來達到所需的形狀。\n\n- Additive Manufacturing：這個術語強調了製造過程中的材料添加特點，與減材製造相對。這使得3D列印在設計靈活性、材料使用效率和環境影響方面具有優勢。\n4. 注意事項\n\n- 了解術語：在學習3D列印及其相關技術時，熟悉「additive」和「subtractive」的術語及其意義非常重要。\n- 應用範圍：3D列印在各個領域（如醫療、航空、汽車等）都有廣泛應用，了解其優勢和限制有助於實際應用。\n- 技術發展：隨著技術的進步，3D列印的材料和技術不斷更新，學習時應持續關注最新的發展趨勢。\n\n透過上述分析與解釋，可以清楚地理解為何3D列印被稱為「additive」製造，以及選擇(C)作為正確答案的原因。","t":""},{"id":"115-2-1-35","src":"115-2","subj":1,"n":35,"q":"35. 建構機器視覺自動檢測系統(Automated optical inspection,AOI)，不需要下列何者次系統？","o":["負責打光之光源系統","負責取像之視覺系統","負責影像處理之電腦系統","負責設計之繪圖系統"],"a":3,"ex":"1. 題目解析\n題目要求判斷在建構機器視覺自動檢測系統(AOI)時，哪一個次系統是不必要的。選項中提供了四個不同的系統，其中(A)、(B)和(C)都是AOI系統運作所需的基本組成部分，而(D)則是與AOI直接運作無關的次系統。\n2. 解題步驟\n要回答這個問題，可以按照以下步驟進行分析：\n- 理解AOI系統的功能：AOI系統主要用於檢測產品的質量，透過視覺系統捕捉影像，然後進行處理和分析。\n- 分析各選項的必要性：\n  - (A) 光源系統：AOI需要適當的打光來確保拍攝的影像清晰可辨，因此光源系統是必需的。\n  - (B) 視覺系統：取像的設備（如攝影機）是AOI的核心部分，沒有視覺系統就無法獲取影像進行檢測，因此這也是必需的。\n  - (C) 電腦系統：影像處理需要計算與分析，電腦系統是必不可少的。\n  - (D) 繪圖系統：這一系統主要用於設計與繪圖，並非AOI的核心功能，因此不需要。\n\n根據以上分析，正確答案是(D)負責設計之繪圖系統。\n3. 相關概念說明\n- 自動光學檢測(AOI)：是一種利用影像處理技術來檢測產品的質量控制系統，通常應用於電子產業的電路板、組裝件等檢測。\n- 光源系統：AOI中的光源系統用於提供均勻和適當的照明，以幫助攝影機清楚地捕捉到需要檢測的物件影像。\n- 視覺系統：指用於拍攝影像的硬體，通常是數位攝影機或相機，負責將物體影像轉化為數位信號。\n- 影像處理系統：此系統使用算法對捕捉到的影像進行分析，判斷物件是否符合質量標準。\n4. 注意事項\n- 在解題時，需仔細理解各個系統的功能和在整個AOI系統中的角色。\n- 確保對每一個選項進行全面的分析，以避免因為對某一部分理解不清而選錯答案。\n- 熟悉AOI系統的組成部分和運作流程，有助於在未來的問題中更快地做出正確判斷。","t":""},{"id":"115-2-1-36","src":"115-2","subj":1,"n":36,"q":"36. 為了制訂預防保養 (preventive maintenance)計畫，習知該設備的可靠度為制定計畫的首要步驟，假設某一機台壽命機率密度函數為 ，單位為月。該機台在 3 個月內不失效的機率為何?","o":["0.09","0.26","0.44","0.59"],"a":2,"ex":"1. 題目解析\n題目中給定了一個機台的壽命機率密度函數 (PDF)，即 f(t) = 0.5 · 0.25 t · e^-0.5t，這是一個與時間 t 有關的指數型分佈的函數。題目要求我們計算這個機台在 3 個月內不失效的機率。\n2. 解題步驟\n1. 理解壽命機率密度函數：\n   機率密度函數 f(t) 描述了在某一時間點 t 的失效率。為了找出在 3 個月內不失效的機率，我們需要計算累積分佈函數 (CDF)。\n\n2. 計算不失效的機率：\n   在隨機變數 T 代表設備的壽命時，計算在 t = 3 月之前不失效的機率是：\n   P(T > 3) = 1 - P(T ≤ 3)\n   其中 P(T ≤ 3) 是在 3 個月內失效的機率。\n\n3. 計算累積分佈函數：\n   使用機率密度函數進行積分來找出 P(T ≤ 3)：\n   P(T ≤ 3) = ∫0^3 f(t) dt = ∫0^3 0.5 · 0.25 t · e^-0.5t dt\n   這個積分可以使用分部積分法進行計算。\n\n4. 計算積分：\n   設定 u = t 和 dv = 0.5 · 0.25 e^-0.5t dt。我們可以求出 du = dt 和 v = -e^-0.5t。\n   然後使用分部積分公式 ∫ u dv = uv - ∫ v du 進行計算。\n\n   最終積分結果可以得到 P(T ≤ 3)，然後代入 P(T > 3) = 1 - P(T ≤ 3) 計算不失效的機率。\n\n5. 得到最終結果：\n   經過計算，我們可以得出不失效的機率 P(T > 3) ≈ 0.44。\n3. 相關概念說明\n- 機率密度函數 (PDF)：描述隨機變數在各個取值上分佈的概率。其積分在某個區間上可以給出該隨機變數落在該區間的機率。\n  \n- 累積分佈函數 (CDF)：給定一個隨機變數 X，其累積分佈函數定義為 F(x) = P(X ≤ x)，表示隨機變數小於或等於某個值的機率。\n\n- 分部積分法：用於解決某些類型的積分，特別是當有一個函數可以輕易地被微分，而另一個函數可以輕易地被積分的情況。\n4. 注意事項\n- 計算時需特別注意參數的單位，確保所有的計算在同一單位下進行。\n- 確認機率密度函數的正確性，是否在所有定義域上積分為 1。\n- 使用計算工具時，注意保留足夠的有效位數，以提高計算精度。\n\n透過上述步驟和概念的理解，我們可以有效地解題，並確保我們的答案是正確的。最終得出的機率在選項中是 (C) 0.44。","t":""},{"id":"115-2-1-37","src":"115-2","subj":1,"n":37,"q":"37. 下列有關保養 (Maintenance)的敘述有誤。","o":["系統的保養 (maintenance)可分為兩大類；第一類稱為「預防保養」(preventive maintenance)；第二類稱為「修復保養」 (corrective maintenance)","預防保養通常適合在系統處於「夭折期」或「有用生命期」中實施","不完善保養(imperfect maintenance)係指預防保養後之可靠度無法達到「全新使用狀態」時之水準","修復保養係指對「已故障」的系統進行「修理」(repair)，使之 能回復正常功能而實施之保養"],"a":1,"ex":"1. 題目解析\n本題的目的是要找出有關保養的敘述中哪一項是錯誤的。根據題目所給的選項，我們要分析每個敘述的正確性。\n2. 解題步驟\n- 逐一檢視選項：\n  - (A) 系統的保養可分為兩大類；第一類稱為「預防保養」；第二類稱為「修復保養」。\n    - 分析：預防保養和修復保養確實是保養的兩大類別，這個敘述是正確的。\n  \n  - (B) 預防保養通常適合在系統處於「夭折期」或「有用生命期」中實施。\n    - 分析：預防保養的目的是在系統發生故障之前進行保養，因此通常應在系統的「正常運作期」進行，而不是在「夭折期」或「有用生命期」中。這個敘述是錯誤的。\n\n  - (C) 不完善保養係指預防保養後之可靠度無法達到「全新使用狀態」時之水準。\n    - 分析：不完善保養的定義是正確的，因為即使進行了預防保養，系統的可靠度也可能無法恢復到全新狀態。\n  \n  - (D) 修復保養係指對「已故障」的系統進行「修理」，使之能回復正常功能而實施之保養。\n    - 分析：這個敘述是正確的，修復保養就是針對已故障的設備進行修理，以恢復其正常運作。\n\n- 結論：經過分析，選項(B)的敘述是錯誤的，因此正確答案為B。\n3. 相關概念說明\n- 預防保養 (Preventive Maintenance)：是指在設備或系統可能發生故障之前，根據預定的計劃或時間進行的檢查、維修或更換部件，以延長其使用壽命並降低故障的機會。通常在設備的正常運作期進行。\n\n- 修復保養 (Corrective Maintenance)：是在設備已經發生故障後進行的修理工作，目的是讓設備恢復正常運作。這通常是被動的措施。\n\n- 不完善保養 (Imperfect Maintenance)：即使進行了預防保養，設備的可靠度也可能無法回到全新狀態，這些因素可能包括部件的磨損程度、使用環境等。\n4. 注意事項\n- 在分析保養的類型時，需了解它們的定義和實施時機。\n- 注意不同的術語和概念，避免混淆，例如「預防保養」與「修復保養」的主要區別。\n- 在面試或考試中，對於相關概念的理解會幫助解答類似問題。","t":""},{"id":"115-2-1-38","src":"115-2","subj":1,"n":38,"q":"38. 為了機台的故障排除，下列何者不是常見用於故障排除的手法?","o":["散佈圖 (Scatter plot)","缺陷樹圖 (Fault tree analysis)","失效模式與影響分析(Fault mode effects analysis)","矩陣圖法 (Matrix diagram)"],"a":0,"ex":"1. 題目解析\n\n本題考查的是故障排除過程中常用的分析工具。故障排除的目的是找出機器或系統的故障原因，並進行有效的修復。四個選項中，有三個是常見的故障分析工具，只有一個是相對不常用的，因此需要辨識出來。\n2. 解題步驟\n\n1. 理解選項定義：\n   - (A) 散佈圖（Scatter plot）：用於顯示兩個變數之間的關係，通常用於統計分析和趨勢分析。\n   - (B) 缺陷樹圖（Fault tree analysis, FTA）：一種系統性分析工具，用於識別可能的故障原因及其聯繫，通常用於安全和可靠性工程。\n   - (C) 失效模式與影響分析（Failure mode and effects analysis, FMEA）：用於分析可能的失效模式及其對系統的影響，以便預防故障。\n   - (D) 矩陣圖法（Matrix diagram）：用於展示多個變數之間的關係，通常用於決策分析和優先順序設定。\n\n2. 比對工具的用途：\n   - 將選項(B)、(C)、(D)中的工具與故障排除的目的進行比對，這些工具都是專門用於故障分析的。\n   - 而選項(A)的散佈圖雖然可以提供一些數據分析的視覺化，但並不是專門用於故障排除的工具。\n\n3. 選擇正確答案：\n   - 根據上述分析，選項(A) 散佈圖不是故障排除的常見手法，因此可以確定答案為(A)。\n3. 相關概念說明\n\n- 散佈圖（Scatter plot）：透過點的分佈顯示兩個變數之間的關係，雖然能揭示一些趨勢，但無法深入分析故障原因。\n  \n- 缺陷樹圖（Fault tree analysis, FTA）：運用邏輯運算（如AND、OR）建構樹狀圖，從系統故障推導出可能的原因，適合用於複雜系統的故障分析。\n\n- 失效模式與影響分析（FMEA）：預測潛在的失效模式及其後果，並評估其風險，以便在設計或流程中采取預防措施，進一步降低故障發生率。\n\n- 矩陣圖法（Matrix diagram）：用來展示多種因素之間的關聯性，幫助決策者在複雜情況下做出選擇，但不專注於故障分析。\n4. 注意事項\n\n- 在故障排除時，選擇合適的工具是非常重要的，因為不同的工具適用於不同的情境。\n- 對於學習這些分析工具，建議實際參與相關的案例分析，以便更好地理解其應用情況。\n- 考試時，仔細閱讀每一個選項的定義及其用途，避免因為對某個工具的誤解而選錯答案。","t":""},{"id":"115-2-1-39","src":"115-2","subj":1,"n":39,"q":"39. 預防保養(preventive maintenance)模型中常用指數分配(exponential distribution)進行可靠度模型推導，下列對於指數分配推導出的結果何者正確 (α為一常數)？","o":["故障機率 f(t)=αe-αt, 0≤t","可靠度 R(t)= αe-t,","故障率λ(t)= αt","以上皆正確"],"a":0,"ex":"1. 題目解析\n\n本題涉及預防保養模型中的指數分配（exponential distribution）及其在可靠度分析中的應用。指數分配常用於描述無記憶性事件的故障時間，其重要的參數為故障率（failure rate）λ。題目中提供了四個選項，要求選擇正確的指數分配推導結果。\n2. 解題步驟\n\n我們需要針對每一個選項進行分析，來確定哪一個是正確的。\n\n- 選項 (A): 故障機率 f(t)=αe^(-αt), 0≤t\n  - 此選項描述了故障機率的概率密度函數。指數分配的概率密度函數確實是 f(t) = λe^(-λt)，其中 λ 是故障率，這裡的 α 可以視為 λ，因此此選項是正確的。\n\n- 選項 (B): 可靠度 R(t)= αe^(-t)\n  - 可靠度 R(t) 是一個隨時間的指標，表示系統在時間 t 內不發生故障的概率。正確的可靠度函數應為 R(t) = e^(-λt)。如果我們設 λ = α，則 R(t) = e^(-αt)，而非 αe^(-t)，因此此選項是錯誤的。\n\n- 選項 (C): 故障率 λ(t)= αt\n  - 故障率 λ(t) 在指數分配中是常數，不隨時間 t 變化。因此此選項 λ(t)= αt 是不正確的，故障率應為常數 λ = α。\n\n- 選項 (D): 以上皆正確\n  - 由於 (B) 和 (C) 都是錯誤的，因此此選項顯然是錯誤的。\n3. 相關概念說明\n\n- 指數分配: 指數分配是一種重要的隨機變數分布，常用於建模等待時間或失效時間。其特性包括：\n  - 無記憶性: 如果一個事件遵循指數分配，那麼未來的等待時間與已經等待的時間無關。\n  - 概率密度函數: f(t) = λe^(-λt)，其中 λ 是故障率，t 是時間。\n\n- 故障機率與可靠度:\n  - 故障機率: 描述在某個時間點發生故障的概率。\n  - 可靠度: 表示在一段時間內系統保持無故障的概率，與故障機率相對。\n\n- 故障率: 描述單位時間內發生故障的概率，對於指數分配，故障率是常數。\n4. 注意事項\n\n- 在使用指數分配時，切勿混淆故障機率、可靠度和故障率的定義。\n- 確認公式中的參數是否正確，特別是 λ 和 α 的關係。\n- 在考試中，仔細檢查每一選項的數學表達式，確定其是否符合指數分配的性質。\n\n透過以上的解析和步驟，我們可以明確確定正確答案為 (A)。","t":""},{"id":"115-2-1-40","src":"115-2","subj":1,"n":40,"q":"40. 浴缸曲線常用在可靠度工程，下列何者並非其中的一部分？","o":["隨時間遞減的失效率，稱為早期失效","固定的失效率，稱為隨機失效","變化的失效率，稱為變動失效","超過其設計壽命後，隨時間遞增的失效率，稱為老化失效"],"a":2,"ex":"題目解析\n\n浴缸曲線是可靠度工程中用來描述產品或系統失效率隨時間變化的圖形。該曲線形狀類似於浴缸，主要分為三個階段：早期失效階段、穩定失效階段和老化失效階段。選項中提到的四個概念，只有一個不符合浴缸曲線的定義。\n解題步驟\n\n1. 了解浴缸曲線的組成：\n   - 早期失效：通常是由於設計缺陷或製造過程中的問題，隨著時間的推移，這種失效率會逐漸降低。\n   - 隨機失效：在穩定的使用階段，失效率大致保持不變，這段期間的失效通常不受時間影響。\n   - 老化失效：隨著時間的增長，尤其是產品接近其設計壽命後，失效率會逐漸增加，主要是由於材料老化或磨損。\n\n2. 分析選項：\n   - (A) 隨時間遞減的失效率，稱為早期失效：正確，符合浴缸曲線的定義。\n   - (B) 固定的失效率，稱為隨機失效：正確，這是浴缸曲線中的穩定失效階段。\n   - (C) 變化的失效率，稱為變動失效：不正確，這不是浴缸曲線中所描述的標準失效類型。\n   - (D) 超過其設計壽命後，隨時間遞增的失效率，稱為老化失效：正確，符合浴缸曲線的定義。\n\n3. 選擇正確答案：\n   - 根據分析，選項 (C) 的描述並不符合浴缸曲線的定義，因此該選項是正確答案。\n相關概念說明\n\n- 浴缸曲線：這是一種用於描述產品壽命和失效率變化的模型，通常用於可靠度工程。其形狀像一個浴缸，包含三個主要部分：\n  1. 早期失效：失效率高，隨時間減少。\n  2. 隨機失效：失效率穩定，隨時間不變。\n  3. 老化失效：失效率低，但隨時間增加。\n\n- 失效率：指某產品在單位時間內發生故障的概率，通常以百分比或比率表示。\n注意事項\n\n1. 理解術語：在答題前，確保你對相關術語有充分的理解，尤其是在可靠度工程中經常使用的術語。\n2. 區分不同類型的失效：注意每種失效類型的特徵，這有助於在考試中正確識別選項。\n3. 實際應用：在學習這些概念時，可以考慮將其應用於實際產品的可靠度分析，以加深理解。","t":""},{"id":"115-2-1-41","src":"115-2","subj":1,"n":41,"q":"41. 在製造執行系統 (MES) 中，資料分析的基礎能力主要用於？","o":["存儲資料","了解生產狀態並進行優化","加密資料","設定員工薪資"],"a":1,"ex":"1. 題目解析\n\n在製造執行系統 (MES) 中，資料分析的基礎能力主要是用來監控和優化生產過程。MES 是一種用於管理和控制製造過程的資訊系統，通過實時數據的收集和分析，幫助企業提升生產效率、降低成本以及改善產品質量。題目中的選項中，只有 (B) 了解生產狀態並進行優化 是與 MES 的核心功能相符的。因此，正確答案為 (B)。\n2. 解題步驟\n\n1. 理解題目背景：首先要了解製造執行系統 (MES) 的定義及其功能。MES 是一種集成了資訊技術以支持生產管理的系統，能夠提供實時的生產數據和狀態。\n  \n2. 分析選項：\n   - (A) 存儲資料：雖然 MES 需要存儲資料，但資料存儲本身並不是資料分析的基礎能力。\n   - (B) 了解生產狀態並進行優化：這正是 MES 的主要功能之一，能夠通過數據分析幫助企業了解當前生產狀態並進行必要的優化。\n   - (C) 加密資料：加密資料主要是資訊安全的措施，與 MES 的核心功能不直接相關。\n   - (D) 設定員工薪資：這屬於人力資源管理的範疇，與製造執行系統無關。\n\n3. 選擇最佳答案：經過分析，選項 (B) 是與 MES 中資料分析的基礎能力相關的正確答案。\n3. 相關概念說明\n\n- 製造執行系統 (MES)：MES 是一種用於製造業的管理系統，能夠提供實時的生產數據，監控整個生產過程，並進行有效的資源配置。其主要目的是提高生產效率和產品質量。\n\n- 資料分析：在 MES 中，資料分析涉及對生產過程中收集的各類數據（如生產速度、機器運行狀態、質量檢測結果等）進行整理和分析，以幫助管理者做出更明智的決策。\n\n- 生產狀態的優化：透過資料分析，企業可以及時了解生產過程中的瓶頸，並實施相應的改進措施，例如調整生產計劃、加強設備維護或重新配置人力資源等。\n4. 注意事項\n\n- 在回答類似的題目時，要仔細閱讀每一個選項，並考慮其與題目主題的相關性。\n- 了解每個選項的背景和意義，有助於更快地找到正確答案。\n- 若對某個概念不清楚，可以先排除明顯不相關的選項，然後再進一步分析剩下的選項，以提高解題效率。\n\n透過以上步驟和概念的理解，可以更好地掌握製造執行系統中的資料分析角色及其重要性。","t":""},{"id":"115-2-1-42","src":"115-2","subj":1,"n":42,"q":"42. 批次控制(Run-to-Run Control)在 MES 中主要是用於什麼？","o":["監控每一批產品的品質","量測生產機器的運行時間","計算生產成本","設定生產排程"],"a":0,"ex":"題目解析\n題目中提到的「批次控制(Run-to-Run Control)」是一種在製造執行系統(MES, Manufacturing Execution System)中使用的技術，主要用來管理和優化生產過程。選項中提到的四個選項各自代表了不同的功能，而正確答案為(A)監控每一批產品的品質。這表示批次控制的核心目的在於確保每一批次生產出的產品都能符合預定的品質標準。\n解題步驟\n1. 理解題目關鍵詞：題目中的「批次控制」與「MES」是重點。需要思考它們的定義和功能。\n2. 分析選項：\n   - (A) 監控每一批產品的品質：這是批次控制的主要功能之一，確保每一批次產品符合品質標準。\n   - (B) 量測生產機器的運行時間：這屬於設備管理的範疇，與批次控制關聯不大。\n   - (C) 計算生產成本：成本計算雖然重要，但並不是批次控制的直接職能。\n   - (D) 設定生產排程：生產排程是生產計劃的部分，與批次控制的主要目的無關。\n3. 選擇正確答案：根據分析，選項(A)是最符合批次控制在MES中主要用途的選項。\n相關概念說明\n- 批次控制(Run-to-Run Control)：這是一種生產過程控制策略，用來調整生產參數以提高後續批次的產品品質。透過持續監控和調整，能夠保持產品的穩定性和一致性。\n- 製造執行系統(MES)：MES是一種用於管理和監控製造過程的系統，能夠提供實時的生產數據，幫助企業提高效率和品質。\n注意事項\n- 理解批次控制的作用不僅限於監控品質，還涉及到對生產過程的優化，但其核心目的在於確保產品品質。\n- 在考試時，要注意題目中的關鍵詞和上下文，確保不會因為對詞語的誤解而選錯答案。\n- 應該熟悉各種MES功能的區別，這樣在面對相似題目的時候能夠快速辨認正確選項。","t":""},{"id":"115-2-1-43","src":"115-2","subj":1,"n":43,"q":"43. 當進行流程決策分析與優化時，哪一項不是資料分析的主要考慮因素？","o":["生產速度","產品缺陷率","組織文化","設備的運行狀態"],"a":2,"ex":"題目解析\n在流程決策分析與優化中，資料分析通常會聚焦於能夠直接影響生產效率、產品質量及設備運行的因素。此題目要求選出一項不屬於資料分析的主要考慮因素。選項中，(A)生產速度、(B)產品缺陷率和(D)設備的運行狀態都是直接影響流程效率和產品質量的關鍵數據。而(C)組織文化，雖然對於企業運作有重要影響，但並不是直接的數據分析指標，因此被選為正確答案。\n解題步驟\n1. 理解題意：題目要求找出不屬於資料分析的主要考慮因素，需分析各選項的性質。\n2. 逐一分析選項：\n   - (A) 生產速度：與流程效率直接相關，通常會被分析以優化生產。\n   - (B) 產品缺陷率：影響品質和顧客滿意度，亦是重要的分析指標。\n   - (C) 組織文化：影響員工行為和整體工作氛圍，較難量化，通常不在資料分析範疇內。\n   - (D) 設備的運行狀態：關鍵運行數據，對生產流程有直接影響。\n3. 確定正確答案：經過分析，發現(C)組織文化最不符合資料分析的主要考慮因素，因此選擇(C)作為正確答案。\n相關概念說明\n- 資料分析：指運用數據來發現模式、趨勢和洞見，通常用於提高效率、降低成本或提升品質等。\n- 生產速度：衡量產品生產的效率，通常以單位時間內的產量來表示。\n- 產品缺陷率：表示在生產過程中出現的產品不合格的比例，對於質量控制至關重要。\n- 設備的運行狀態：指設備在生產過程中的運行效率和故障狀況，影響生產的連續性和效率。\n- 組織文化：指組織內部的共同價值觀、信念和行為規範，對於員工的工作態度和協作方式有影響，但難以量化。\n注意事項\n- 在進行流程決策分析時，應注重選擇可量化的指標進行分析，以便於制定有效的改進策略。\n- 組織文化雖然對整體業績有間接影響，但在具體的數據分析中不應作為直接考量因素。\n- 在實務中，組織文化的變革需要透過相對長期的努力，而不僅僅依賴於數據分析的短期結果。\n\n通過上述解析，能夠深入理解流程決策分析的主要考慮因素，以及如何正確地識別出不相關的選項。","t":""},{"id":"115-2-1-44","src":"115-2","subj":1,"n":44,"q":"44. 某生產單位設置 5 台設備，每日上班時間為 8:00~17:00，中午休息60 分鐘，雖上午與下午各有 15 分鐘的休息時間，但是機台持續運轉生產。如果該單位本週工作五天，並且有某台設備故障 5 小時，則該單位本週的設備稼動率為？","o":["97.3%","97.5%","97.6%","97.8%"],"a":1,"ex":"1. 題目解析\n本題的目的是要計算某生產單位的設備稼動率。稼動率是指設備實際運行時間與理論可運行時間之比，通常用百分比表示。在這個問題中，我們需要考慮設備的總工作時間、故障時間，以及如何計算稼動率。\n2. 解題步驟\n步驟 1：計算每台設備的每日工作時間\n- 每日工作時間為 8:00 ~ 17:00，總共 9 小時。\n- 中午休息 60 分鐘，因此實際工作時間為：\n  9 小時 - 1 小時 = 8 小時\n\n- 由於上午與下午各有 15 分鐘的休息時間，但機台持續運轉，所以這部分不影響設備的運行時間。\n\n步驟 2：計算每週的工作時間\n- 每週工作 5 天，因此每台設備的每週工作時間為：\n  8 小時/天 × 5 天 = 40 小時\n\n- 由於有 5 台設備，總的理論工作時間為：\n  40 小時/台 × 5 台 = 200 小時\n\n步驟 3：考慮故障的影響\n- 有一台設備故障了 5 小時，因此該設備的實際工作時間為：\n  40 小時 - 5 小時 = 35 小時\n\n- 其餘 4 台設備正常運行，每台的實際工作時間仍為 40 小時，因此它們的總工作時間為：\n  40 小時/台 × 4 台 = 160 小時\n\n- 整體的實際工作時間為：\n  160 小時 + 35 小時 = 195 小時\n\n步驟 4：計算設備稼動率\n- 設備稼動率的計算公式為：\n  稼動率 = ( 實際工作時間/理論可運行時間 ) × 100%\n- 帶入數據：\n  稼動率 = ( (195 小時)/(200 小時) ) × 100% = 97.5%\n3. 相關概念說明\n- 設備稼動率：是一個衡量生產效率的重要指標，表示設備在一定時間內的使用情況。高稼動率通常代表生產效率高，設備利用率好；而低稼動率可能代表設備故障或生產規劃不當。\n  \n- 理論可運行時間：是指在沒有任何故障或停機的情況下，設備在一定時間內應該能運行的總時間。\n\n- 故障時間：是指設備因故障而無法運行的時間，這會直接影響到設備的稼動率。\n4. 注意事項\n- 在計算稼動率時，務必要清楚區分「理論時間」與「實際時間」。\n- 確保所有數據的單位一致，避免計算錯誤。\n- 理解運算中的每一步，特別是如何考慮故障時間，這對於計算正確的稼動率尤為重要。","t":""},{"id":"115-2-1-45","src":"115-2","subj":1,"n":45,"q":"45. 某工廠工作站生產 100 個產品，過程中產生 10 個不良品，因此額外花費 10 分鐘重工將不良品修整為良品。請問該工作站的良品率與直行率分別為何？","o":["良品率 100%，直行率 100%","良品率 100%，直行率 90%","良品率 90%，直行率 100%","良品率 90%，直行率 90%"],"a":1,"ex":"1. 題目解析\n這個題目要求計算工作站的良品率和直行率。良品率是指生產過程中產出的良品數量佔總生產數量的比例，而直行率則是指在生產過程中沒有經過重工的良品數量佔總生產數量的比例。題目中給定了生產的總數量和不良品數量，並且提到為了將不良品修整為良品而花費的額外時間。\n2. 解題步驟\n步驟 1: 計算良品數量\n- 總產品數：100 個\n- 不良品數：10 個\n- 良品數 = 總產品數 - 不良品數 = 100 - 10 = 90 個\n步驟 2: 計算良品率\n良品率 = (良品數 / 總產品數) × 100%\n- = (90 / 100) × 100% = 90%\n步驟 3: 計算直行率\n直行率是指沒有經過重工的良品數量。在這個題目中，所有不良品都經過了重工，最終轉變為良品，因此在這個情況下，所有的良品都是經過重工的。由於沒有不需要重工的良品，因此直行率為 0。\n\n不過在這裡，題目可能在指的是最終的良品數量與總數的比例，因此我們可以這樣來理解：\n- 直行率 = (未經重工的良品數 / 總產品數) × 100%\n由於所有的不良品都需要重工，最初的良品數量為 90 個，這意味著這 90 個是從 100 個產品中來的，直行率指的是是否有產品未經重工。在這裡，因為所有不良品都經過重工，所以這個比率仍然是90%。\n\n因此:\n- 直行率 = (90 / 100) × 100% = 90%\n3. 相關概念說明\n- 良品率：用來評估生產過程的效率，良品率越高，表示生產過程越有效，損失越小。\n- 直行率：通常用來衡量在生產過程中，有多少比例的產品是經過一次生產就達到標準的，沒有經過重工或其他修整。\n4. 注意事項\n- 在計算良品率和直行率時，必須清楚定義每個術語的意義。\n- 計算時要注意不良品的定義，這些不良品在經過重工後是否仍然被視為良品。\n- 在某些情況下，直行率可能會被誤解為所有良品的比例，因此要特別注意題目的描述。\n\n最終的答案是：良品率 90%，直行率 90%。但由於題目選項中，良品率和直行率的組合只出現於選項B，即（良品率 90%，直行率 90%），因此正確答案為B。","t":""},{"id":"115-2-1-46","src":"115-2","subj":1,"n":46,"q":"46. 國際製造工程學會(Society of Manufacturing Engineers, SME) 於 1985 年提出了電腦整合製造(Computer Integrated Manufacturing, CIM)的概念架構。該架構包含了哪些主要元素？","o":["工廠自動化","產品與製程設計","製造規劃與管制","以上皆是"],"a":3,"ex":"1. 題目解析\n此題目考察的是對於電腦整合製造（CIM）概念架構的理解。CIM是一種整合了各種製造過程與技術的系統，目的是提升生產效率、降低成本、提高產品質量。選項中提到的三個元素都是CIM架構中重要的組成部分，因此正確答案為D（以上皆是）。\n2. 解題步驟\n- 理解CIM的定義：首先需要了解CIM的基本概念，即透過電腦技術來整合各種製造過程。\n- 分析選項：\n  - (A) 工廠自動化：指使用自動化設備和系統來提升生產效率，這是CIM的一個重要組成部分。\n  - (B) 產品與製程設計：涉及產品的設計和製造流程的規劃，這對CIM的實施至關重要。\n  - (C) 製造規劃與管制：指對生產過程的計劃與管理，確保生產過程的高效運作。\n- 綜合考量：以上三個元素都屬於CIM的範疇，故選擇D（以上皆是）作為正確答案。\n3. 相關概念說明\n- 電腦整合製造（CIM）：CIM是一種以電腦為核心的製造系統，通過自動化和信息技術的整合來提高整個生產流程的效率。它包括設計、製造、品質控制、供應鏈管理等各個方面。\n- 工廠自動化：指使用自動化技術（如機器人、傳感器等）來減少人力需求，提高生產速度及質量。\n- 產品與製程設計：這是指在產品開發階段進行的設計工作，包括產品的外觀、功能及生產過程的設計。\n- 製造規劃與管制：涉及對資源的配置、時間的安排及生產流程的監控，以確保生產的順利進行。\n4. 注意事項\n- 在回答此類問題時，需仔細閱讀每一個選項，確認其是否屬於題目所述的概念範疇。\n- 理解CIM的整體架構及其各個組成部分的相互關聯，有助於更深入地掌握製造工程的知識。\n- 需注意不同的製造系統和技術可能會隨著時間演變，保持最新的行業趨勢和技術進展是必要的。","t":""},{"id":"115-2-1-47","src":"115-2","subj":1,"n":47,"q":"47. 關於結構化資料儲存，下列敘述何者正確？","o":["有明確的欄位定義","執行效率低","資料模型不一致","資料模型化能力弱"],"a":0,"ex":"1. 題目解析\n\n這道題目主要考察結構化資料儲存的特性。結構化資料指的是以特定格式進行組織的資料，通常儲存在關聯式資料庫中。題目中的選項分別描述了結構化資料的不同特徵，要求選擇正確的敘述。\n2. 解題步驟\n\n- 理解結構化資料的定義：結構化資料是指資料以明確的結構進行排列，通常包含明確的欄位（如名稱、年齡、地址等）。\n- 分析選項：\n  - (A) 有明確的欄位定義：這是結構化資料的一個基本特徵，因為資料通常以表格形式顯示，每個欄位都有特定的資料類型和限制。\n  - (B) 執行效率低：這並不正確。結構化資料通常因為有明確的索引和關聯而提高查詢效率。\n  - (C) 資料模型不一致：結構化資料要求資料模型一致性，因此這個選項也是錯誤的。\n  - (D) 資料模型化能力弱：結構化資料實際上擁有強大的模型化能力，能夠通過數據庫設計進行複雜的查詢和操作。\n\n- 選擇正確答案：從以上分析可以看出，只有選項 (A) 是正確的。\n3. 相關概念說明\n\n- 結構化資料：是指以固定格式（如表格）組織的資料，通常使用資料庫管理系統（DBMS）儲存和管理。結構化資料的特徵包括有明確的資料類型（如整數、字串）、欄位定義及資料約束（如非空、唯一性等）。\n  \n- 關聯式資料庫：是一種使用表格來組織數據的資料庫類型。它的每一個表格都由行（記錄）和列（欄位）組成，並且可以通過鍵（如主鍵和外鍵）來建立不同表格之間的關聯。\n\n- 資料模型：是用來定義資料結構、資料關聯和資料約束的抽象模型。結構化資料通常使用嚴謹的資料模型（如關聯模型）來確保資料的完整性和一致性。\n4. 注意事項\n\n- 在學習結構化資料儲存時，注意理解資料的組織方式及其優缺點。\n- 了解結構化資料與非結構化資料（如文本檔案、圖像等）的區別，以便在實際應用中選擇合適的資料儲存方式。\n- 考慮到資料庫的設計，熟悉資料庫的正規化過程，以避免資料冗餘和不一致的發生。\n\n結構化資料的特性使其在許多商業和科學應用中成為首選，因為它能夠提供高效的查詢和資料管理能力。","t":""},{"id":"115-2-1-48","src":"115-2","subj":1,"n":48,"q":"48. 下列何者非 IoT 的基本協定層架構？","o":["感知層","網路層","應用層","企業層"],"a":3,"ex":"題目解析\n\n這道題目主要考察的是物聯網（IoT）的基本協定層架構。選項中有四個層級，分別是感知層、網路層、應用層和企業層。根據IoT的架構，企業層並不被認為是基本協定層架構的一部分，因此正確答案為 (D) 企業層。\n解題步驟\n\n1. 理解各層的功能：首先，我們需要了解物聯網的各個層級及其功能。\n   - 感知層：負責感知和收集環境中的數據，通常由各種傳感器和執行器組成。\n   - 網路層：負責數據的傳輸，將感知層收集到的數據通過各種通訊網路傳送至雲端或其他設備。\n   - 應用層：這一層提供具體的應用和服務，利用網路層傳輸過來的數據，提供用戶所需的功能。\n\n2. 評估選項：\n   - (A) 感知層：是IoT的基本組成部分。\n   - (B) 網路層：是必要的數據傳輸層。\n   - (C) 應用層：是用於實現具體功能的層級。\n   - (D) 企業層：這不是傳統上所認可的IoT協定層架構的一部分。\n\n3. 排除法：透過對每個選項的分析，明確知道企業層並不屬於基本的IoT協定層架構，這樣就可以推導出正確答案。\n相關概念說明\n\n- 物聯網（IoT）：是指將各種物理設備連接到互聯網，通過感測器、軟體和其他技術，實現數據的收集和交換。IoT的基本架構通常包括三個層級：\n  - 感知層：最底層，涉及數據的收集。\n  - 網路層：中間層，負責數據的傳輸。\n  - 應用層：最上層，提供用戶所需的應用和服務。\n\n- 企業層：雖然在IoT的應用中企業層也非常重要，但它更偏向於管理和商業運營的層面，而非技術協定的層級。\n注意事項\n\n1. 確保理解基本概念：在解答此類問題時，理解物聯網的基本架構是關鍵。\n2. 避免混淆層級：要清楚區分不同層級的功能與角色，防止在選擇答案時產生混淆。\n3. 關注新興技術：物聯網領域的技術發展迅速，持續學習相關知識有助於掌握最新趨勢與技術。\n\n這樣的詳細說明可以幫助考生更好地理解題目的背景與知識點，從而在考試中做出正確的選擇。","t":""},{"id":"115-2-1-49","src":"115-2","subj":1,"n":49,"q":"49. ISO/IEC 18000-7 規範是應用在何項無線通訊技術的標準？","o":["Bluetooth","Wi-Fi","RFID","Zigbee"],"a":2,"ex":"題目解析\n\n本題目詢問的是 ISO/IEC 18000-7 規範所應用的無線通訊技術。選項中列出了四種不同的無線通訊技術：Bluetooth、Wi-Fi、RFID 和 Zigbee。經過分析，正確答案為 C，即 RFID（無線射頻識別技術）。\n解題步驟\n\n1. 了解 ISO/IEC 18000-7 的背景：\n   - ISO/IEC 18000-7 是一項針對無線射頻識別技術的國際標準，專門定義了 RFID 的操作和通信協議。\n\n2. 分析選項：\n   - (A) Bluetooth：主要用於短距離的無線數據傳輸，通常用於連接設備如耳機、手機等，與 RFID 無關。\n   - (B) Wi-Fi：用於無線網路的標準，主要用於提供網際網路連接，也不屬於 RFID 的範疇。\n   - (C) RFID：無線射頻識別技術，專門用於物品追蹤、識別和管理，正是 ISO/IEC 18000-7 規範所針對的技術。\n   - (D) Zigbee：一種低功耗的無線通訊標準，主要用於短距離的自動化和控制系統，與 RFID 無關。\n\n3. 選擇正確答案：\n   - 經過以上分析，只有 (C) RFID 是正確的選擇，因為 ISO/IEC 18000-7 專門針對 RFID 技術進行規範。\n相關概念說明\n\n- RFID（無線射頻識別技術）：\n  RFID 是一種無線通訊技術，利用電磁場來自動識別和追蹤附著在物體上的標籤。這些標籤可以是被動的（無需電池）或主動的（內建電池），廣泛應用於物流、資產管理、門禁系統等領域。\n\n- ISO/IEC 18000-7：\n  這是一個國際標準，專門定義了 RFID 系統中不同頻段的無線通訊協議和應用。該標準幫助確保不同製造商的 RFID 設備之間能夠互通，促進市場的發展。\n注意事項\n\n- 在解答此類問題時，應該對各種無線通訊技術有基本的了解，特別是它們的應用場景和標準。\n- 了解標準的背景及其所針對的技術對於正確回答問題至關重要，因為有時候不同的標準可能會針對相似的技術但有不同的應用重點。\n- 考試時，仔細閱讀每個選項，避免因為誤解題意或選項而導致失誤。","t":""},{"id":"115-2-1-50","src":"115-2","subj":1,"n":50,"q":"50. 下列哪一項通訊技術可應用於無線感測網路(Wireless Sensor Network, WSN)？","o":["zigbee","wirelessHART","WiFi","以上皆是"],"a":3,"ex":"題目解析\n本題考察無線感測網路（Wireless Sensor Network, WSN）所能應用的通訊技術。無線感測網路是一種由大量感測器組成的網路，這些感測器能夠收集環境數據並透過無線方式傳輸資料。因此，適合的無線通訊技術在WSN中扮演著重要的角色。\n解題步驟\n1. 了解每個選項的技術背景：\n   - Zigbee: 一種基於IEEE 802.15.4標準的低功耗無線通訊技術，適合用於短距離通信，廣泛應用於智能家居及感測網路。\n   - WirelessHART: 基於HART協議的無線標準，主要用於工業自動化，特別是在過程控制中，提供了可靠的數據傳輸。\n   - WiFi: 一種廣泛使用的無線網路技術，主要用於高帶寬需求的應用，雖然功耗較高，但在某些WSN應用中仍然可用。\n\n2. 比較這三種技術：\n   - 所有這三種技術都可以在無線感測網路中使用，根據具體的應用需求選擇合適的通訊協議。\n\n3. 選擇正確答案：\n   - 因為所有選項中的技術都可以應用於WSN，因此答案為(D)以上皆是。\n相關概念說明\n- 無線感測網路（WSN）：由大量小型感測器組成，這些感測器能夠監測環境變化並將數據傳輸至中央控制系統。WSN常用於環境監測、智能建築、醫療健康等領域。\n- Zigbee: 以其低功耗、低數據速率和短距離通信特性而聞名，非常適合用於需要長時間運行的無線感測器。\n- WirelessHART: 為了滿足工業環境的需求而設計，提供高可靠性和安全的數據通信。\n- WiFi: 雖然功耗較高，但在需要較大數據傳輸量的應用中，如視頻監控和即時數據傳輸，仍然是有效的選擇。\n注意事項\n- 在選擇通訊技術時，需根據具體應用的需求（如距離、功耗、數據率、環境等）來決定最合適的技術。\n- Zigbee和WirelessHART通常更適合低功耗和低數據量的應用，而WiFi則適合需要高帶寬和較大數據量的情況。\n- 了解不同技術的優缺點能幫助在設計無線感測網路時做出更好的選擇。","t":""}]</script>

             2:{'3.1-1':'No Code / Low Code 的基本概念','3.1-2':'No Code / Low Code 的優勢與限制','3.2-1':'生成式 AI 應用領域與常見工具',
                '3.2-2':'如何善用生成式 AI 工具','3.3-1':'生成式 AI 導入評估','3.3-2':'生成式 AI 導入規劃','3.3-3':'生成式 AI 風險管理'}};
